 "objects":{
  i:"An object maps string keys to values. You reach a value by key with dot or bracket notation. Objects model a thing with named fields, and they are passed around by reference, not copied.",
  s:[["const o = {name: \"Ada\", age: 36};","Two key/value pairs."],
     ["o.name","Dot access: \"Ada\"."],
     ["o[\"age\"]","Bracket access, for dynamic keys."],
     ["o.city = \"London\"","Adds a key."],
     ["Object.keys(o)","An array of the keys."],
     ["Object.entries(o)","An array of [key, value] pairs."],
     ["\"name\" in o","Tests for a key."]],
  w:["Use brackets when the key is in a variable: o[k], not o.k (which looks for a literal \"k\").",
     "const o = other copies the reference; changing o.x changes other.x. Spread {...o} for a shallow copy.",
     "Reading a missing key gives undefined, not an error — a typo in a key name fails silently."]
 },
 "functions & arrow fns":{
  i:"A function takes arguments and returns a value. Arrow functions are a shorter syntax; a one-expression arrow returns that expression with no return keyword. Arrows also keep the surrounding this instead of getting their own.",
  s:[["function add(a, b) { return a + b; }","A named function."],
     ["const add = (a, b) => a + b;","The same thing as an arrow."],
     ["const sq = x => x * x;","One argument needs no parentheses."],
     ["const f = () => 42;","No arguments."],
     ["const g = x => ({v: x});","Wrap a returned object literal in parentheses."],
     ["function f(a = 1) {}","A default argument."]],
  w:["An arrow with braces needs an explicit return: x => { return x*2 }. Without braces it returns automatically.",
     "To return an object literal from an arrow, wrap it: x => ({a: x}). Bare braces read as a function body.",
     "Arrow functions have no own this — do not use them as object methods that rely on this."]
 },
 "map/filter/reduce":{
  i:"These three replace most loops over arrays. map transforms every element into a new array, filter keeps the elements that pass a test, and reduce boils the whole array down to a single value. None of them change the original.",
  s:[["nums.map(x => x * 2)","A new array, each element doubled."],
     ["nums.filter(x => x > 0)","Only the elements that pass the test."],
     ["nums.reduce((acc, x) => acc + x, 0)","Sums into acc, starting at 0."],
     ["nums.map((x, i) => i)","The callback also receives the index."],
     ["words.filter(Boolean)","Drops empty and falsy entries."],
     ["nums.reduce((a, b) => Math.max(a, b))","No seed: starts from the first element."]],
  w:["map always returns an array of the same length. To get fewer, that is filter.",
     "reduce needs a starting value as the second argument; leave it off on an empty array and it throws.",
     "These return new arrays. nums.map(...) on its own line does nothing unless you use the result."]
 },
 "destructuring":{
  i:"Destructuring unpacks values out of arrays and objects into variables in one statement. Array destructuring goes by position; object destructuring goes by key name.",
  s:[["const [a, b] = [1, 2];","a is 1, b is 2."],
     ["const [x, , z] = arr;","Skip the middle element."],
     ["const [head, ...rest] = arr;","rest is an array of the remainder."],
     ["const {name, age} = person;","Pull keys by name."],
     ["const {name: n} = person;","Rename to n."],
     ["const {city = \"NA\"} = person;","A default when the key is missing."],
     ["[a, b] = [b, a];","Swap without a temporary."]],
  w:["Object destructuring matches by key name, so order does not matter — but the names must match the keys exactly.",
     "Renaming is {key: newName}, which reads backwards the first few times.",
     "Destructuring null or undefined throws. Give a fallback: const {x} = obj || {}."]
 },
 "promises":{
  i:"A promise represents a value that is not ready yet — the result of something asynchronous. It settles once, either fulfilled with a value or rejected with an error, and you attach handlers with .then and .catch.",
  s:[["fetch(url)","Returns a promise, not the data."],
     ["p.then(v => ...)","Runs when it fulfills, with the value."],
     ["p.catch(e => ...)","Runs if it rejects."],
     ["p.finally(() => ...)","Runs either way."],
     ["Promise.resolve(5)","An already-fulfilled promise."],
     ["Promise.all([p1, p2])","Fulfills with both results, or rejects on the first failure."]],
  w:[".then gives you the value; the promise object itself is not the value. You cannot read it synchronously.",
     "An unhandled rejection is a silent bug. Always attach a .catch (or use try/catch with await).",
     "Promise.all rejects as soon as any one rejects. Use Promise.allSettled to get every result regardless."]
 },
 "async/await":{
  i:"async/await is syntax over promises that lets asynchronous code read top to bottom. await pauses inside an async function until a promise settles and gives you its value; errors surface as normal exceptions you catch with try/catch.",
  s:[["async function f() {}","Always returns a promise."],
     ["const v = await p;","Waits for p, then v is its value."],
     ["const data = await fetch(url);","Pauses until the fetch settles."],
     ["try { await p } catch (e) {}","Catches a rejection as an exception."],
     ["await Promise.all([a, b])","Wait for several at once."],
     ["const f = async () => { await g(); };","An async arrow function."]],
  w:["await only works inside an async function. At the top level of a normal script it is a syntax error.",
     "Awaiting inside a loop runs the calls one after another. To run them together, start them all, then await Promise.all.",
     "An async function returns a promise even when you return a plain value — the caller still awaits it."]
 },
 "closures":{
  i:"A closure is a function that remembers the variables from the scope where it was created, even after that scope has finished. It is what lets an inner function keep using an outer function's variables after the outer one returns.",
  s:[["function make(n) { return () => n; }","The returned function closes over n."],
     ["const get5 = make(5);","n is fixed at 5 for this one."],
     ["get5()","Returns 5, from the remembered n."],
     ["function counter() { let c = 0; return () => ++c; }","Keeps private state."],
     ["const next = counter();","One counter with its own c."],
     ["next(); next();","1, then 2 — c persists between calls."]],
  w:["Each call to the outer function makes a fresh closure with its own variables. Two counters do not share a count.",
     "A closure captures the variable, not a snapshot of its value. In a var loop, all closures see the final value — use let.",
     "Closures keep their captured variables alive in memory; holding many of them adds up."]
 }
},
r:{
 "vectors":{
  i:"The vector is R's basic unit — an ordered sequence of values of one type. Most operations work on a whole vector at once, element by element, so you rarely write a loop.",
  s:[["v <- c(1, 2, 3)","c() combines values into a vector."],
     ["v * 2","Multiplies every element: 2 4 6."],
     ["v + c(10, 20, 30)","Element-wise addition."],
     ["length(v)","How many elements."],
     ["sum(v)","Adds them: 6."],
     ["1:5","A vector 1 2 3 4 5."],
     ["seq(0, 1, by = 0.25)","0 0.25 0.5 0.75 1."]],
  w:["A vector holds one type. c(1, \"a\") coerces every element to character.",
     "Operating on two vectors of different lengths recycles the shorter one, often silently — a common cause of wrong answers.",
     "R indexing starts at 1, not 0."],
  read:["R has no separate idea of a single value. When you write x <- 5 you have made a numeric vector of length one, which is why R answers with [1] 5 — that [1] is the position of the first element printed on the line, and on a long vector you will see [12] or [25] start the later lines. Once you accept that everything is a vector, most of R's behaviour stops looking odd.","Because the arithmetic is vectorised, you apply an operation to the whole vector and R walks the elements for you. v * 2 doubles every element, v + w adds two vectors position by position, and sum(v) collapses a vector down to one number. Writing a loop to do the same work is not wrong, it is just longer, slower, and harder to read.","When an operation gets two vectors of different lengths, R recycles the shorter one from its start until the lengths match. That rule is what makes v * 2 work at all — the 2 is recycled across every element. It is also the rule that bites: if the longer length is an exact multiple of the shorter, R recycles without a word, and you get a full vector of confidently wrong numbers."],
  practice:[{code:"v <- c(2, 4, 6)\nv * 10\nsum(v)",out:"[1] 20 40 60\n[1] 12",why:"Arithmetic is element-wise, so every element is multiplied; sum() collapses the vector to a single value."},{code:"c(1, 2, 3, 4) + c(10, 20)",out:"[1] 11 22 13 24",why:"The shorter vector is recycled to 10 20 10 20 before the addition, and the lengths divide evenly so R stays silent."},{code:"length(seq(0, 10, by = 2))\nrev(1:4)",out:"[1] 6\n[1] 4 3 2 1",why:"seq() includes both ends, so 0 2 4 6 8 10 is six values; rev() reverses the order."}]
 },
 "data types":{
  i:"R's common types are numeric, character, logical, and the factor for categories. A value can be missing, marked NA, and NA is contagious — most operations on it return NA unless you say otherwise.",
  s:[["x <- 3.14","numeric."],
     ["s <- \"text\"","character."],
     ["b <- TRUE","logical — TRUE/FALSE, all caps."],
     ["class(x)","Reports the type."],
     ["as.numeric(\"5\")","Converts \"5\" to 5."],
     ["is.na(x)","Tests for a missing value."],
     ["f <- factor(c(\"a\",\"b\",\"a\"))","A categorical vector."]],
  w:["Logicals are TRUE and FALSE (or T and F), all caps — not Python's True/False.",
     "Any arithmetic involving NA gives NA. Use sum(v, na.rm = TRUE) to skip it.",
     "A factor prints like text but is stored as integer codes; treating it as a string can surprise you."],
  read:["Every element of a vector has to be the same type, so when you mix types in one c() call R does not error — it coerces. The order is fixed: logical becomes numeric, and numeric becomes character, never the other way. That is why c(1, TRUE) is numeric and c(1, \"a\") is character. Coercion is silent, so a single stray quotation mark in a column of numbers turns the whole column into text.","A missing value is written NA, and it is not zero and not an empty string — it is the absence of a value. Because R cannot know what the missing number was, arithmetic that touches it answers NA: sum(c(3, NA, 5)) is NA, and that is the honest answer. Passing na.rm = TRUE tells the function to drop the missing values first. Testing with x == NA never works, because that comparison is itself NA; use is.na(x).","Conversion between types is a deliberate call: as.numeric(), as.character(), as.integer(), as.logical(). They return NA with a warning when the conversion makes no sense, so as.numeric(\"twelve\") is NA rather than an error. as.integer() truncates towards zero instead of rounding, so as.integer(2.9) is 2."],
  practice:[{code:"class(c(1, TRUE))\nclass(c(1, \"a\"))",out:"[1] \"numeric\"\n[1] \"character\"",why:"TRUE is promoted to 1, so the first stays numeric; one string drags everything to character."},{code:"x <- c(3, NA, 5)\nsum(x)\nsum(x, na.rm = TRUE)",out:"[1] NA\n[1] 8",why:"A sum touching a missing value is unknowable, so it is NA until na.rm drops it."},{code:"as.integer(2.9)\nas.numeric(\"12\") + 1\nis.na(NA)",out:"[1] 2\n[1] 13\n[1] TRUE",why:"as.integer() truncates rather than rounds, as.numeric() parses the text before the addition, and is.na() is the only reliable test for missingness."}]
 },
 "data frames":{
  i:"A data frame is a table: named columns, each a vector, all the same length. It is how R holds rectangular data. Columns can differ in type, but within a column every value is the same type.",
  s:[["df <- data.frame(a = 1:3, b = c(\"x\",\"y\",\"z\"))","Two columns."],
     ["df$a","The column named a, as a vector."],
     ["df[[\"b\"]]","The same column, by name."],
     ["nrow(df)","Number of rows."],
     ["ncol(df)","Number of columns."],
     ["head(df, 2)","The first two rows."],
     ["df$c <- df$a * 2","Adds a new column."]],
  w:["df$a returns a vector; df[\"a\"] returns a one-column data frame. The bracket difference changes the type.",
     "Old versions of R turned string columns into factors by default. Pass stringsAsFactors = FALSE if you are on one.",
     "Every column must be the same length; mismatched lengths error or recycle."],
  read:["A data frame is a list of vectors of equal length, presented as a table. That definition explains its behaviour: the columns are the list elements, so anything that walks a list walks the columns, and the rows are just positions shared across every column. Column types can differ from each other but never within a column.","There are three ways to reach a column and they do not return the same thing. df$score and df[[\"score\"]] both give you the column as a plain vector. df[\"score\"] gives you a data frame with one column still wrapped around it. Reaching for the wrong one is the usual reason a function complains that it was handed a data frame when it wanted numbers.","You add a column by assigning to a name that does not exist yet: df$total <- df$price * df$qty. The right-hand side has to be the same length as the frame, or a length that recycles into it. To look at part of the table, index with [rows, columns] — leave a side empty to take all of it, and note that df[1] is the first column while df[1, ] is the first row."],
  practice:[{code:"df <- data.frame(name = c(\"Ana\", \"Bo\"), score = c(88, 72))\nnrow(df)\nncol(df)\nnames(df)",out:"[1] 2\n[1] 2\n[1] \"name\"  \"score\"",why:"nrow and ncol report the shape; names() returns the column names as a character vector."},{code:"df <- data.frame(a = 1:3, b = c(10, 20, 30))\ndf$c <- df$a * df$b\ndf",out:"  a  b  c\n1 1 10 10\n2 2 20 40\n3 3 30 90",why:"The new column is computed element-wise and printed with the row numbers down the left."},{code:"df <- data.frame(a = 1:3)\nclass(df$a)\nclass(df[\"a\"])",out:"[1] \"integer\"\n[1] \"data.frame\"",why:"$ unwraps the column to a vector; single brackets keep the data frame around it."}]
 },
 "indexing":{
  i:"You pull pieces out of vectors and data frames with square brackets. For a data frame the form is [rows, columns]: leave one side blank to take all of it. You can index by position, by name, or by a logical test.",
  s:[["v[1]","The first element (R counts from 1)."],
     ["v[c(1, 3)]","Elements 1 and 3."],
     ["v[-1]","Everything except the first."],
     ["v[v > 2]","Only the elements passing the test."],
     ["df[1, ]","Row 1, all columns."],
     ["df[, \"a\"]","All rows, column a."],
     ["df[df$a > 1, ]","Rows where a > 1."]],
  w:["v[-1] means \"drop element 1\", not \"the last element\" as in Python. Negative indices exclude.",
     "In df[rows, cols], the comma matters: df[1] is column 1, df[1, ] is row 1.",
     "A logical index must be the right length, or it recycles and selects the wrong rows."],
  read:["Square brackets accept four different things, and knowing which one you are handing over explains the result. Positive numbers select those positions. Negative numbers drop them. A logical vector keeps the positions that are TRUE. A character vector selects by name. Positions count from 1, so v[1] is the first element and v[0] returns an empty vector rather than an error.","Selecting by condition is the workhorse. v > 6 does not give you values, it gives you a logical vector the same length as v, and feeding that back in as v[v > 6] keeps the elements where the test held. which(v > 6) turns the same test into the positions instead, which is what you want when you need to know where a value is rather than what it is.","For a data frame the bracket takes two slots separated by a comma: df[rows, columns]. Leave the row slot empty to take every row, or the column slot empty to take every column. The comma carries all the meaning — df[2] asks for the second column, df[2, ] asks for the second row. If a selection reduces the result to a single column, R quietly drops it to a vector unless you pass drop = FALSE."],
  practice:[{code:"v <- c(10, 20, 30, 40)\nv[2]\nv[-1]\nv[c(TRUE, FALSE, TRUE, FALSE)]",out:"[1] 20\n[1] 20 30 40\n[1] 10 30",why:"Positive positions select, negative positions exclude, and a logical vector keeps the TRUE slots."},{code:"v <- c(4, 15, 8, 23)\nv[v > 10]\nwhich(v > 10)",out:"[1] 15 23\n[1] 2 4",why:"The first returns the values passing the test; which() returns their positions instead."},{code:"df <- data.frame(name = c(\"Ana\", \"Bo\", \"Cy\"), score = c(88, 72, 95))\ndf[2, \"name\"]\ndf[df$score > 80, \"name\"]",out:"[1] \"Bo\"\n[1] \"Ana\" \"Cy\"",why:"Both index [rows, column]; one row is chosen by position, the other by a logical test over the score column."}]
 },
 "functions":{
  i:"You define a function with function(), and the value of its last expression is returned automatically — you rarely write return. Assign it to a name to call it.",
  s:[["sq <- function(x) x^2","A one-line function."],
     ["sq(4)","Calls it: 16."],
     ["f <- function(x, y = 1) x + y","y has a default."],
     ["f(3)","Uses the default: 4."],
     ["g <- function(x) { r <- x*2; r }","The last expression is returned."],
     ["return(x)","An explicit early return."]],
  w:["The last evaluated expression is the return value; ending on an assignment returns nothing visible.",
     "Arguments are lazy — not evaluated until used. A default can even refer to another argument.",
     "Assigning with <- inside a function creates a local copy; it does not change the caller's variable."],
  read:["A function in R is a value like any other: function(x) x^2 creates it, and the assignment gives it a name. Because it is a value you can pass it to another function without ceremony, which is what the whole apply family depends on. The body is either a single expression or a braced block, and the value of the last expression evaluated is what comes back.","Arguments can be matched by position or by name, and named arguments can appear in any order, so f(3, y = 2) and f(y = 2, x = 3) call the same thing. A default value goes in the signature and may refer to the other arguments, because R does not evaluate an argument until the body actually uses it. That laziness is why function(x, y = x * 2) works.","Nothing you assign inside a function reaches outside it. A function gets its own environment, and writing v <- something in the body creates a local name even if v exists in the caller. To keep a result you return it and the caller assigns it. Printing instead of returning is the classic beginner swap: a printed value is gone as soon as it hits the screen."],
  practice:[{code:"f <- function(x, y = 2) x^y\nf(3)\nf(3, 3)",out:"[1] 9\n[1] 27",why:"The default supplies y on the first call; the second call overrides it by position."},{code:"f <- function(x) {\n  y <- x * 2\n  y + 1\n}\nf(3)",out:"[1] 7",why:"The braced body returns the value of its last expression, not the assignment above it."},{code:"f <- function(x, y = x * 2) x + y\nf(3)",out:"[1] 9",why:"Arguments are lazy, so the default for y is not computed until it is needed, by which time x is known."}]
 },
 "apply family":{
  i:"Instead of writing loops, R applies a function across a structure. sapply and lapply walk a vector or list; apply walks the rows or columns of a matrix or data frame. They collect the results together.",
  s:[["sapply(1:3, function(x) x^2)","1 4 9, simplified to a vector."],
     ["lapply(1:3, function(x) x^2)","The same, returned as a list."],
     ["sapply(df, class)","The class of each column."],
     ["apply(m, 1, sum)","Row sums of a matrix (margin 1)."],
     ["apply(m, 2, sum)","Column sums (margin 2)."],
     ["vapply(v, f, numeric(1))","Like sapply, but you assert the return type."]],
  w:["apply's second argument is the margin: 1 is rows, 2 is columns. Swapping them computes the wrong axis.",
     "sapply tries to simplify and sometimes returns a matrix or a list you did not expect. lapply always returns a list.",
     "These are not faster than a for loop by magic — they are about clarity, not speed."],
  read:["The apply family answers one question: run this function once per element, and hand me the results. lapply is the honest version — it always returns a list with one element per input, whatever the function gave back. sapply is lapply with a convenience step on the end that simplifies the list to a vector or matrix when the shapes allow it.","That simplification is the catch. sapply returns a vector when every result is a single value, a matrix when every result is a vector of the same length, and a list when the results are ragged — so the type you get depends on the data, not on the code you wrote. In a script that matters, vapply is the safer call: you declare the expected shape, such as numeric(1), and it fails loudly when a result does not fit.","Because a data frame is a list of columns, sapply(df, mean) walks the columns and keeps their names, which is the fastest way to summarise a table. apply is the odd one out: it works on a matrix and needs a margin, where 1 means rows and 2 means columns. Passing a data frame to apply forces it into a matrix first, so mixed column types all become character."],
  practice:[{code:"sapply(1:4, function(x) x^2)",out:"[1]  1  4  9 16",why:"Every result is one number, so sapply simplifies the list down to a numeric vector."},{code:"res <- lapply(1:3, function(x) x * 10)\nclass(res)\nres[[2]]",out:"[1] \"list\"\n[1] 20",why:"lapply never simplifies, so the result is a list and you reach into it with double brackets."},{code:"df <- data.frame(a = c(1, 2, 3), b = c(4, 5, 6))\nsapply(df, mean)",out:"a b\n2 5",why:"A data frame is a list of columns, so sapply walks the columns and keeps their names on the result."}]
 },
 "tibbles & pipes":{
  i:"A tibble is a data frame with the sharp edges filed off: it prints a summary instead of dumping the whole table, and it never silently changes a column's type. The pipe |> takes the value on its left and hands it to the function on its right as the first argument, so a chain of steps reads in the order it happens.",
  s:[["library(tibble)","Loads the package that provides tibble()."],
     ["t <- tibble(x = 1:3, y = c(\"a\",\"b\",\"c\"))","Builds a tibble from named column vectors."],
     ["t","Prints the size, each column's type, and the first rows."],
     ["as_tibble(df)","Converts an existing data frame."],
     ["t$x","One column, as a plain vector."],
     ["c(4, 9, 16) |> sqrt()","The pipe: the vector becomes sqrt's first argument."],
     ["x |> f() |> g()","Reads left to right, and means the same as g(f(x))."],
     ["t |> nrow()","Pipes into any function, not only tidyverse ones."]],
  w:["The native pipe needs the parentheses on the right: x |> sqrt is a syntax error, x |> sqrt() is not.",
     "The pipe always fills the FIRST argument. When the value belongs elsewhere, name the other arguments and pass _ where it goes.",
     "A tibble prints ten rows and stops. That is the printing method being polite, not the data being cut short."],
  read:["A tibble is a data frame — it passes every test for one, and any function that takes a data frame takes a tibble. What changes is the rough edges. Printing shows the dimensions, the type under each column name, and the first ten rows, so typing the name of a large table no longer floods the console. Subsetting with single brackets always returns a tibble rather than quietly collapsing to a vector, so what you get back does not depend on how many columns you happened to keep.","The pipe is the other half of the style. x |> f() evaluates f(x), and chaining several calls turns a nest of parentheses inside out: sum(sqrt(c(4, 9, 16))) becomes c(4, 9, 16) |> sqrt() |> sum(), which reads in the order the work happens. |> is built into R itself, so no package is needed for it. You will also meet %>% from magrittr in older tidyverse code; the two behave the same for everyday chains.","One practical note for this app: attaching a tidyverse package prints a notice about which functions it masks, and that notice becomes part of your output when the grader compares text. Load packages with suppressPackageStartupMessages(library(dplyr)) in these drills so the only thing in your output is what you meant to print."],
  practice:[{code:"suppressPackageStartupMessages(library(tibble))\ntibble(x = 1:3, y = c(\"a\", \"b\", \"c\"))",out:"# A tibble: 3 × 2\n      x y\n  <int> <chr>\n1     1 a\n2     2 b\n3     3 c",why:"A tibble prints its dimensions and the type of each column above the rows."},{code:"c(4, 9, 16) |> sqrt() |> sum()",out:"[1] 9",why:"The pipe feeds each result into the next call as its first argument, so this is sum(sqrt(c(4, 9, 16)))."},{code:"suppressPackageStartupMessages(library(tibble))\nt <- tibble(x = 1:3, y = c(2, 4, 6))\nclass(t[, \"x\"])\nclass(t$x)",out:"[1] \"tbl_df\"     \"tbl\"        \"data.frame\"\n[1] \"integer\"",why:"Single brackets on a tibble always return a tibble; the dollar sign unwraps the column to a vector."}]
 },
 "dplyr verbs":{
  i:"dplyr gives you a handful of verbs that each do exactly one thing to a table: filter() keeps rows, select() keeps columns, mutate() adds columns, arrange() sorts, and rename() renames. Each takes the table as its first argument and returns a new table, which is why they chain.",
  s:[["suppressPackageStartupMessages(library(dplyr))","Loads dplyr without the attach notice."],
     ["filter(df, score > 80)","Keeps the rows where the test is TRUE."],
     ["select(df, name, score)","Keeps those columns, in that order."],
     ["select(df, -id)","Keeps everything except that column."],
     ["mutate(df, total = price * qty)","Adds a column computed from the others."],
     ["arrange(df, score)","Sorts ascending."],
     ["arrange(df, desc(score))","Sorts descending."],
     ["df |> filter(score > 80) |> arrange(name)","The verbs chain with the pipe."]],
  w:["filter() drops the rows where the test is NA as well as the rows where it is FALSE — a missing value is never kept.",
     "Every verb returns a new table and changes nothing. If you do not assign the result or pipe it onward, the work is gone.",
     "Attaching dplyr masks stats::filter() and stats::lag(). The notice saying so is a notice, not an error."],
  read:["The verbs are deliberately small. filter() chooses rows by a condition, select() chooses columns by name, mutate() adds or replaces a column, arrange() reorders rows, and summarise() collapses many rows into one. None of them changes the table you gave them; each returns a new one. That is what makes a pipeline safe to read — nothing behind you has been altered.","Inside a verb you refer to columns by bare name, with no quotation marks and no df$ prefix: filter(df, score > 80), not filter(df, df$score > 80). dplyr evaluates the expression inside the table's own context. It reads well, and it is also why a stray variable with the same name as a column can confuse a pipeline.","arrange() sorts ascending by default and takes desc() to flip a column, and it puts missing values last whichever way you sort. select() accepts negative names to drop columns and helpers like starts_with() to grab families of them. When the result matters, sort before you print: two rows with equal keys keep their original order, so a pipeline that never sorts is only as predictable as the data that went in."],
  practice:[{code:"suppressPackageStartupMessages(library(dplyr))\ndf <- data.frame(name = c(\"Ana\", \"Bo\", \"Cy\"), score = c(88, 72, 95))\ndf |> filter(score > 80) |> select(name)",out:"  name\n1  Ana\n2   Cy",why:"filter() keeps the two qualifying rows, then select() keeps one column — and the row numbers restart."},{code:"suppressPackageStartupMessages(library(dplyr))\ndf <- data.frame(x = c(1, 2, 3))\ndf |> mutate(double = x * 2) |> arrange(desc(double))",out:"  x double\n1 3      6\n2 2      4\n3 1      2",why:"mutate() adds the column, then arrange(desc()) sorts on it from largest to smallest."},{code:"suppressPackageStartupMessages(library(dplyr))\ndf <- data.frame(x = c(5, NA, 9))\nnrow(filter(df, x > 6))",out:"[1] 1",why:"The NA row tests to NA, which is not TRUE, so filter() drops it along with the row that failed."}]
 },
 "grouping & summaries":{
  i:"group_by() does not change a table, it labels it: every verb that follows works within each group instead of across the whole thing. summarise() then collapses each group to a single row, which is how you get one number per team, per city, per month.",
  s:[["df |> group_by(team)","Marks the groups; the rows are untouched."],
     ["df |> group_by(team) |> summarise(total = sum(pts))","One row per team."],
     ["summarise(df, n = n())","n() counts the rows in the group."],
     ["summarise(df, avg = mean(pts))","Any summary function works."],
     ["df |> count(city)","Group and tally in one step, into a column named n."],
     ["df |> group_by(team) |> mutate(share = pts / sum(pts))","Grouped mutate keeps every row."],
     ["ungroup(df)","Removes the grouping when you are done."],
     ["df |> group_by(team) |> summarise(n = n()) |> arrange(team)","Sort before printing."]],
  w:["summarise() drops every column you did not summarise. If you need a column to survive, group by it or summarise it too.",
     "Grouping survives the summarise when you grouped by more than one column, so the next verb is still grouped. Call ungroup() or pass .groups = \"drop\".",
     "mean() of a column holding NA returns NA. Pass na.rm = TRUE when the data has gaps."],
  read:["Grouping splits a table into pieces without moving any data. group_by(team) attaches the grouping to the table, and the verbs that follow respect it: summarise() produces one row per group, mutate() computes within each group but keeps every row, and filter() tests within each group. The pattern reads as split, apply, combine, and dplyr handles the splitting and combining for you.","summarise() is where rows disappear. Whatever you name inside it becomes a column of the result, and everything you do not name is dropped, because there is no honest single value for a column you did not aggregate. n() is the count of rows in the group, and the usual functions — sum(), mean(), min(), max() — take a column and give back one number.","count() is the shorthand you will reach for constantly: df |> count(city) is group_by(city) followed by summarise(n = n()). Since groups come back in the order the grouping values were encountered, add arrange() before printing whenever the order of the output matters."],
  practice:[{code:"suppressPackageStartupMessages(library(dplyr))\ndf <- data.frame(team = c(\"red\", \"blue\", \"red\"), pts = c(3, 5, 7))\ndf |> group_by(team) |> summarise(total = sum(pts)) |> arrange(team)",out:"# A tibble: 2 × 2\n  team  total\n  <chr> <dbl>\n1 blue      5\n2 red      10",why:"Each team collapses to one row, and the result comes back as a tibble."},{code:"suppressPackageStartupMessages(library(dplyr))\ndf <- data.frame(city = c(\"Rome\", \"Oslo\", \"Rome\"))\ndf |> count(city) |> arrange(city)",out:"  city n\n1 Oslo 1\n2 Rome 2",why:"count() groups and tallies in one call, naming the tally column n."},{code:"suppressPackageStartupMessages(library(dplyr))\ndf <- data.frame(team = c(\"red\", \"blue\"), pts = c(3, 5))\ndf |> summarise(rows = n(), avg = mean(pts))",out:"  rows avg\n1    2   4",why:"With no grouping, summarise() treats the whole table as one group and returns exactly one row."}]
 },
 "tidy data":{
  i:"Data is tidy when each variable is a column, each observation is a row, and each cell holds one value. Real tables usually break one of those rules, and tidyr's job is to reshape them until they do not: pivot_longer() when column headings are really data, pivot_wider() when one variable is spread down a column.",
  s:[["suppressPackageStartupMessages(library(tidyr))","Loads tidyr quietly."],
     ["pivot_longer(df, cols = c(q1, q2), names_to = \"quarter\", values_to = \"sales\")","Headings become a column of values."],
     ["pivot_wider(df, names_from = quarter, values_from = sales)","The reverse: values become columns."],
     ["separate_wider_delim(df, code, delim = \"-\", names = c(\"a\", \"b\"))","Splits one column into two on a separator."],
     ["drop_na(df)","Drops the rows holding any missing value."],
     ["replace_na(df, list(sales = 0))","Fills the gaps in a named column."],
     ["unite(df, \"code\", a, b, sep = \"-\")","Glues two columns back into one."]],
  w:["Long and wide are not right and wrong. Long is what most tidyverse functions expect; wide is often what a person wants to read.",
     "pivot_wider() gives NA for every combination that had no row. Missing cells in the wide table mean missing rows in the long one.",
     "The column names in cols = c(q1, q2) are bare, not quoted, but names_to and values_to are given as quoted strings. Mixing that up is the usual error."],
  read:["Tidy is a shape, not a quality of the numbers. One variable per column, one observation per row, one value per cell. Data arrives untidy for good reasons: a spreadsheet with one column per quarter is easy to read and easy to type into, but it hides the quarter — the variable — inside the column headings, where no function can reach it.","pivot_longer() fixes that case. You name the columns that are really values, say what the headings should be called with names_to, and what the cells should be called with values_to. Four rows across two quarter columns become eight rows with a quarter column beside them. The table gets taller and narrower, and every variable finally has a name you can group by, filter on, or plot.","pivot_wider() runs the other way, taking the names from one column and the cells from another, which is what you want for a table meant to be read by a person or for a matrix-shaped calculation. The two are inverses in principle, but not always in practice: widening a table that had no row for some combination produces NA in that cell, and narrowing it again keeps that NA as a row unless you drop it."],
  practice:[{code:"suppressPackageStartupMessages(library(tidyr))\ndf <- data.frame(name = c(\"Ana\", \"Bo\"), q1 = c(3, 5), q2 = c(8, 2))\npivot_longer(df, cols = c(q1, q2), names_to = \"quarter\", values_to = \"sales\")",out:"# A tibble: 4 × 3\n  name  quarter sales\n  <chr> <chr>   <dbl>\n1 Ana   q1          3\n2 Ana   q2          8\n3 Bo    q1          5\n4 Bo    q2          2",why:"Two rows across two quarter columns become four rows, with the headings moved into a column of their own."},{code:"suppressPackageStartupMessages(library(tidyr))\ndf <- data.frame(name = c(\"Ana\", \"Ana\", \"Bo\"), quarter = c(\"q1\", \"q2\", \"q1\"), sales = c(3, 8, 5))\npivot_wider(df, names_from = quarter, values_from = sales)",out:"# A tibble: 2 × 3\n  name     q1    q2\n  <chr> <dbl> <dbl>\n1 Ana       3     8\n2 Bo        5    NA",why:"Bo has no q2 row, so the widened table has nothing to put in that cell and fills it with NA."},{code:"suppressPackageStartupMessages(library(tidyr))\ndf <- data.frame(code = c(\"a-1\", \"b-2\"))\nseparate_wider_delim(df, code, delim = \"-\", names = c(\"letter\", \"num\"))",out:"# A tibble: 2 × 2\n  letter num\n  <chr>  <chr>\n1 a      1\n2 b      2",why:"One cell holding two values is split into two columns, and both halves come back as text."}]
 },
 "joins":{
  i:"A join matches rows from two tables on a key column. inner_join() keeps only the rows that match on both sides; left_join() keeps every row of the left table and fills in NA where the right side had nothing. Which one you pick decides how many rows come out.",
  s:[["suppressPackageStartupMessages(library(dplyr))","dplyr provides the joins."],
     ["inner_join(a, b, by = \"id\")","Only the ids found in both."],
     ["left_join(a, b, by = \"id\")","Every row of a, NA where b had no match."],
     ["right_join(a, b, by = \"id\")","Every row of b instead."],
     ["full_join(a, b, by = \"id\")","Everything from both sides."],
     ["anti_join(a, b, by = \"id\")","The rows of a with no match in b."],
     ["semi_join(a, b, by = \"id\")","The rows of a that do match, with no columns added."],
     ["left_join(a, b, by = c(\"pid\" = \"id\"))","When the key is named differently on each side."]],
  w:["If a key appears twice on the right, the left row is duplicated once per match. A join that returns more rows than you started with means a key you thought was unique is not.",
     "Joining without by = lets dplyr guess from the shared column names and print what it guessed. Say the key explicitly.",
     "The key columns have to be the same type. Joining a character id to a numeric id errors rather than quietly matching."],
  read:["Two tables about the same things, joined on the column they have in common: that is the whole idea. The key is usually an id, and every join asks the same question of each row — is there a match on the other side? What differs is what happens when the answer is no.","inner_join() drops the unmatched rows from both sides, so the result can only shrink. left_join() keeps every row of the left table, padding the added columns with NA where nothing matched, which is what you want when the left table is your data and the right is a lookup you are decorating it with. full_join() keeps everything from both. anti_join() and semi_join() add no columns at all — they use the second table purely as a filter, which is the quickest way to answer which of these are missing from that.","The trap is row counts. A join is only one-to-one when the key is unique on the right; if the right table has two rows for the same key, the matching left row is repeated twice, and a table you expected to keep its size has quietly grown. Check nrow() before and after a join you are unsure of, and be explicit with by = so you always know which column the match ran on."],
  practice:[{code:"suppressPackageStartupMessages(library(dplyr))\na <- data.frame(id = c(1, 2, 3), name = c(\"Ana\", \"Bo\", \"Cy\"))\nb <- data.frame(id = c(1, 3), city = c(\"Rome\", \"Oslo\"))\ninner_join(a, b, by = \"id\") |> arrange(id)",out:"  id name city\n1  1  Ana Rome\n2  3   Cy Oslo",why:"Id 2 has no match on the right, so the inner join drops that row entirely."},{code:"suppressPackageStartupMessages(library(dplyr))\na <- data.frame(id = c(1, 2), name = c(\"Ana\", \"Bo\"))\nb <- data.frame(id = c(1), city = c(\"Rome\"))\nleft_join(a, b, by = \"id\") |> arrange(id)",out:"  id name city\n1  1  Ana Rome\n2  2   Bo <NA>",why:"A left join keeps every row on the left and fills the missing city with NA."},{code:"suppressPackageStartupMessages(library(dplyr))\na <- data.frame(id = c(1, 2), name = c(\"Ana\", \"Bo\"))\nb <- data.frame(id = c(1, 1), tag = c(\"x\", \"y\"))\nnrow(left_join(a, b, by = \"id\"))",out:"[1] 3",why:"The key is duplicated on the right, so the matching left row is repeated once per match and the table grows."}]
 },
 "ggplot2 basics":{
  i:"A ggplot is built in layers: the data, a mapping from columns to visual properties, and one or more geoms that draw something. You add the pieces with +, and nothing is drawn until the object is printed.",
  s:[["suppressPackageStartupMessages(library(ggplot2))","Loads ggplot2 quietly."],
     ["ggplot(df, aes(x = w, y = h))","The data and the mapping; nothing is drawn yet."],
     ["+ geom_point()","Draws the rows as points."],
     ["+ geom_line()","Another layer on the same mapping."],
     ["+ geom_col()","Bars whose height is the y column."],
     ["+ labs(x = \"Width\", title = \"Growth\")","Axis labels and a title."],
     ["p <- ggplot(...) + geom_point()","A plot is an object you can store."],
     ["length(p$layers)","How many geoms the object carries."]],
  w:["Layers are joined with +, not with the pipe. Mixing |> into the middle of a plot is a syntax error.",
     "aes() is for mapping a column to a property. A fixed colour is not a mapping — colour = \"blue\" goes outside aes(), or you get a legend for a one-value variable.",
     "This app grades text, so it cannot show you the picture. The drills inspect the plot object instead; the same code draws a chart in RStudio."],
  read:["The grammar behind ggplot2 separates three decisions that beginners usually mix together: what the data is, which column maps to which visual property, and what shape is drawn. ggplot(df, aes(x = w, y = h)) settles the first two and draws nothing. Adding + geom_point() supplies the third, and only then is there anything to see.","Because the plot is an ordinary R object, you can assign it, add to it later, and look inside it. p$data is the data frame it will draw, p$layers is the list of geoms, and p$labels holds the labels you set. That is what the drills here use: this app captures text, not images, so the plot object is inspected rather than displayed. In RStudio or a notebook, printing the same p draws the chart.","Anything inside aes() is a mapping from a column to a property, and ggplot2 will add a legend to explain it. Anything outside aes() is a fixed setting. geom_point(colour = \"blue\") makes every point blue; aes(colour = \"blue\") invents a variable whose only value is the word blue and gives you a legend saying so. That single distinction accounts for most early confusion with the package."],
  practice:[{code:"suppressPackageStartupMessages(library(ggplot2))\ndf <- data.frame(w = c(1, 2, 3), h = c(2, 4, 6))\np <- ggplot(df, aes(x = w, y = h)) + geom_point()\nlength(p$layers)\nnrow(p$data)",out:"[1] 1\n[1] 3",why:"One geom means one layer, and the plot object still holds the whole data frame it was given."},{code:"suppressPackageStartupMessages(library(ggplot2))\ndf <- data.frame(w = c(1, 2), h = c(3, 4))\np <- ggplot(df, aes(x = w, y = h)) + geom_point() + geom_line() + labs(title = \"Growth\")\nlength(p$layers)\np$labels$title",out:"[1] 2\n[1] \"Growth\"",why:"Each geom adds a layer, and labs() stores the title on the object rather than drawing it."},{code:"suppressPackageStartupMessages(library(ggplot2))\ndf <- data.frame(w = c(1, 2), h = c(3, 4))\np <- ggplot(df, aes(x = w, y = h))\nlength(p$layers)",out:"[1] 0",why:"A plot with no geom is a legal object with nothing to draw, which is why an empty panel is the symptom of a forgotten layer."}]
 },
 "strings & regex":{
  i:"Text work in R is vectorised like everything else: one call tests, replaces, or trims a whole character vector. Regular expressions describe the pattern you are looking for, and the base functions and stringr's str_ functions do the same jobs with different names.",
  s:[["nchar(v)","How many characters in each element."],
     ["toupper(v)","Upper-cases every element."],
     ["substr(s, 1, 3)","Characters 1 to 3 of each element."],
     ["grepl(\"pie\", v)","TRUE or FALSE per element: does the pattern occur."],
     ["sub(\"a\", \"-\", v)","Replaces the FIRST match in each element."],
     ["gsub(\"a\", \"-\", v)","Replaces EVERY match."],
     ["strsplit(\"a,b\", \",\")","Splits into a list of pieces."],
     ["str_detect(v, \"pie\")","stringr's version of grepl, with the vector first."]],
  w:["sub() replaces one match per element and gsub() replaces all of them. Reaching for sub() when you meant gsub() leaves half the job done.",
     "A backslash in a regex has to be doubled in an R string: \"\\\\d\" is the pattern for a digit, because the string swallows one backslash before the regex sees it.",
     "grepl() returns a logical vector while grep() returns positions. They differ by one letter and give completely different things."],
  read:["Every string function in R takes a vector and returns one, so you never loop over text. nchar() gives a length per element, toupper() a converted element, and a comparison such as grepl(\"pie\", v) gives one TRUE or FALSE per element. Because a logical vector is also a valid index, testing and selecting are one step apart: v[grepl(\"pie\", v)] is every element that matched.","A regular expression is a small language for describing text. A plain word matches itself; ^ anchors to the start and $ to the end; . matches any character; \\\\d is a digit and \\\\s is whitespace; + means one or more of what came before. The doubling of the backslash is an R detail, not a regex one — the string literal consumes one backslash, so the pattern needs two to receive one.","The base functions and stringr do the same work. grepl/sub/gsub/substr map onto str_detect/str_replace/str_replace_all/str_sub, and the stringr versions are more consistent: the string always comes first, the pattern second, and the return type never changes with the input. Either family is fine, but mixing argument orders between them is a reliable way to get a confusing result."],
  practice:[{code:"v <- c(\"apple\", \"banana\")\nnchar(v)\ntoupper(v)\nsubstr(v, 1, 3)",out:"[1] 5 6\n[1] \"APPLE\"  \"BANANA\"\n[1] \"app\" \"ban\"",why:"Each call runs over the whole vector and returns one result per element."},{code:"s <- \"banana\"\nsub(\"a\", \"-\", s)\ngsub(\"a\", \"-\", s)",out:"[1] \"b-nana\"\n[1] \"b-n-n-\"",why:"sub() stops after the first match; gsub() keeps going to the end of the string."},{code:"v <- c(\"apple pie\", \"banana\", \"cherry pie\")\ngrepl(\"pie\", v)\nv[grepl(\"pie\", v)]",out:"[1]  TRUE FALSE  TRUE\n[1] \"apple pie\"  \"cherry pie\"",why:"grepl() returns one logical per element, and feeding that logical vector back in as an index keeps the TRUE positions."}]
 },
 "factors & dates":{
  i:"A factor stores a categorical variable as integer codes plus a table of levels, which is how R knows that low, med and high have an order that is not alphabetical. A Date is stored as a count of days from 1970-01-01, which is why subtracting two of them gives a number of days.",
  s:[["f <- factor(c(\"a\", \"b\", \"a\"))","A factor with levels a and b."],
     ["levels(f)","The levels, in their stored order."],
     ["factor(x, levels = c(\"low\", \"med\", \"high\"))","Sets the order explicitly."],
     ["table(f)","Counts the rows per level."],
     ["as.numeric(as.character(f))","The safe way back to numbers."],
     ["d <- as.Date(\"2024-03-01\")","Parses ISO text into a Date."],
     ["d1 - d2","A difftime, printed in days."],
     ["format(d, \"%Y-%m\")","Formats a date as text."]],
  w:["as.numeric() on a factor returns the integer CODES, not the labels. as.numeric(factor(c(\"10\",\"20\"))) is 1 2, not 10 20.",
     "Without an explicit levels argument, the levels are sorted alphabetically, so high comes before low and every ordered chart is wrong.",
     "as.Date() on a non-ISO string needs a format: as.Date(\"01/03/2024\", format = \"%d/%m/%Y\"). Without it you get NA or the wrong day."],
  read:["A factor is two things at once: a vector of small integers, and a character vector of levels those integers index into. It prints like text, so the integers stay hidden until they surprise you. The reason to use one is order — a factor with levels set to low, med, high sorts, groups, and plots in that order, while the same values as plain text sort alphabetically into high, low, med.","The classic factor bug is converting one back to a number. as.numeric() hands you the internal codes, so a factor of the labels 10 and 20 becomes 1 and 2. The route back is through the labels: as.numeric(as.character(f)). Modern R no longer turns character columns into factors when you build a data frame, so most factors now exist because you asked for one, which is the right way round.","Dates are a count of days since 1970-01-01 wearing a class that knows how to print itself. That representation makes arithmetic natural: subtracting two Dates gives a difftime measured in days, and adding 7 to a Date moves it a week forward. as.Date() parses ISO text (YYYY-MM-DD) with no help; anything else needs an explicit format string built from codes like %d, %m and %Y. format() runs the same codes in reverse to turn a date back into text."],
  practice:[{code:"f <- factor(c(\"low\", \"high\", \"med\", \"low\"), levels = c(\"low\", \"med\", \"high\"))\nlevels(f)\ntable(f)",out:"[1] \"low\"  \"med\"  \"high\"\nf\n low  med high\n   2    1    1",why:"The levels keep the order you declared, and table() counts in that order rather than alphabetically."},{code:"f <- factor(c(\"10\", \"20\", \"10\"))\nas.numeric(f)\nas.numeric(as.character(f))",out:"[1] 1 2 1\n[1] 10 20 10",why:"The first converts the internal codes; only the round trip through as.character() recovers the labels."},{code:"d1 <- as.Date(\"2024-03-01\")\nd2 <- as.Date(\"2024-01-15\")\nd1 - d2\nformat(d1, \"%Y-%m\")",out:"Time difference of 46 days\n[1] \"2024-03\"",why:"Subtracting two Dates gives a difftime in days, and format() turns a date back into text with the codes you supply."}]
 },
 "iteration":{
  i:"R has the loops you would expect — for over a sequence, while over a condition, repeat until you break out — but you reach for them less often, because vectorised operations and the apply family already cover most of the cases where another language would loop.",
  s:[["for (i in 1:3) print(i)","Runs the body once per element."],
     ["for (x in v) ...","Loops over the values instead of the positions."],
     ["seq_along(v)","The positions 1..length(v), safe when v is empty."],
     ["out <- numeric(length(v))","Allocate the result before the loop."],
     ["out[i] <- v[i]^2","Fill by position rather than growing."],
     ["while (n < 100) n <- n * 2","Repeats while the condition holds."],
     ["repeat { ...; if (done) break }","Loops until you break out."],
     ["next","Skips to the next pass."]],
  w:["for (i in 1:length(v)) breaks on an empty vector: 1:0 counts DOWN and gives 1 0, so the body runs twice. seq_along(v) gives nothing, which is what you wanted.",
     "Growing a result with out <- c(out, x) copies the whole vector every pass. Allocate the full length first and fill by position.",
     "A for loop's variable survives the loop and holds the last value it took. Reusing i afterwards without resetting it is a quiet source of bugs."],
  read:["The R style is to loop only when the work genuinely depends on the previous step. Squaring every element is not that: v^2 already does it, and sapply covers the cases where the operation is not vectorised. A running balance where each row depends on the last, or a loop that repeats until a condition is met, is the real use for iteration.","When you do write a for loop, loop over positions with seq_along(v) rather than 1:length(v). The two agree on every non-empty vector and disagree exactly when it matters: on an empty vector 1:length(v) is 1:0, which counts down and runs the body twice with meaningless indices, while seq_along() gives an empty sequence and the loop is skipped.","Allocate the result before the loop. out <- numeric(length(v)) makes room once and then out[i] <- ... fills it, whereas out <- c(out, value) builds a new copy of the whole vector on every pass. while and repeat cover the cases where the number of steps is not known in advance — while tests before each pass, repeat runs until an explicit break, and next skips the rest of the current pass in either."],
  practice:[{code:"v <- c(2, 5, 9)\nout <- numeric(length(v))\nfor (i in seq_along(v)) {\n  out[i] <- v[i] * 10\n}\nout",out:"[1] 20 50 90",why:"The result is allocated first, then filled by position, so nothing is copied as the loop runs."},{code:"n <- 1\nsteps <- 0\nwhile (n < 20) {\n  n <- n * 3\n  steps <- steps + 1\n}\nn\nsteps",out:"[1] 27\n[1] 3",why:"The condition is checked before each pass, so the loop stops the first time n reaches 20 or more."},{code:"x <- c()\nlength(1:length(x))\nlength(seq_along(x))",out:"[1] 2\n[1] 0",why:"1:length(x) becomes 1:0, which counts down through two values; seq_along() returns nothing, which is why it is the safe one."}]
 }

mermaid:{
 "flowchart syntax":{
  i:"A flowchart starts by declaring the diagram type and a direction, then lists nodes and the arrows between them. Mermaid lays it out for you — you only describe what connects to what.",
  s:[["flowchart TD","Declares a flowchart, top-down."],
     ["flowchart LR","Left-to-right instead."],
     ["A --> B","An arrow from node A to node B."],
     ["A --> B --> C","A chain in one line."],
     ["A[Start] --> B[End]","Nodes with labels."]],
  w:["The first line must declare the type (flowchart or graph) and a direction, or nothing renders.",
     "Node ids are the bare words (A, B); the text in brackets is only the label.",
     "TD/TB is top-down, LR is left-right. Mixing up the letters just rotates the layout."]
 },
 "node shapes":{
  i:"The bracket you wrap a node's label in decides its shape — a rectangle, a rounded box, a diamond for decisions, and so on. The shape carries meaning, so pick it to match the node's role.",
  s:[["A[Square]","A rectangle."],
     ["B(Rounded)","Rounded corners."],
     ["C([Stadium])","A pill / stadium shape."],
     ["D{Decision}","A diamond, for a branch point."],
     ["E[[Subroutine]]","A framed process box."],
     ["F[(Database)]","A cylinder."]],
  w:["Every opening bracket needs its matching close of the same kind. Mismatched brackets stop the whole diagram rendering.",
     "The diamond {} is for decisions — use it where the flow splits, not for an ordinary step.",
     "If a label has special characters, wrap it in quotes: A[\"a/b (c)\"]."]
 },
 "edge types":{
  i:"Edges are not all the same. A solid arrow shows normal flow, a dotted arrow a weaker or optional link, a thick arrow emphasis, and you can label any of them to say what the connection means.",
  s:[["A --> B","A solid arrow."],
     ["A --- B","A plain line, no arrowhead."],
     ["A -.-> B","A dotted arrow."],
     ["A ==> B","A thick arrow."],
     ["A -->|yes| B","A labelled arrow."],
     ["A -- text --> B","Another way to label an edge."]],
  w:["The arrowhead is the > at the end. A --- B has no head and reads as an undirected link.",
     "A label goes in |pipes| right after the arrow, or between two dashes — do not mix the two forms in one edge.",
     "Dotted and thick are -.-> and ==>; get the dots or dashes wrong and it falls back to a plain line."]
 },
 "sequence diagrams":{
  i:"A sequence diagram shows messages passing between participants over time, read top to bottom. Each participant gets a vertical lifeline, and arrows between lifelines are the messages — solid for calls, dashed for replies.",
  s:[["sequenceDiagram","Declares the diagram type."],
     ["participant Server","Names a participant explicitly."],
     ["A->>B: Request","A solid arrow carrying a message."],
     ["B-->>A: Reply","A dashed arrow, for the response."],
     ["A-)B: Async","An open arrowhead, asynchronous."],
     ["Note over A: text","A note on the diagram."]],
  w:["Sequence arrows use ->> and -->>, not the flowchart's -->. Flowchart syntax will not render here.",
     "The message text goes after a colon on the same line. Forget the colon and the label drops.",
     "Order is time: put the messages in the order they actually happen, top to bottom."]
 },
 "state diagrams":{
  i:"A state diagram shows the states something can be in and the transitions between them. A special start marker shows where it begins, and each arrow can carry the event that causes the move.",
  s:[["stateDiagram-v2","Declares the diagram type."],
     ["[*] --> Idle","The start marker points at the first state."],
     ["Idle --> Running","A transition."],
     ["Running --> [*]","A transition to the end."],
     ["Running --> Idle: stop","A transition with an event label."],
     ["state \"Waiting\" as W","Give a state a display name."]],
  w:["[*] is both the start and the end marker; which it means depends on whether it is the arrow's source or target.",
     "Use stateDiagram-v2, not the older stateDiagram, for the current layout engine.",
     "The event label goes after a colon on the transition, the same as a sequence message."]
 }

// Three settings: "light" (default), "dark", "system". Only "system" consults
// the device, and only because the user picked it — nothing here reacts to the
// OS unless asked, which is what keeps a force-darkening device from deciding
// for us. matchMedia is feature-detected; without it "system" resolves light.
const THEME_COLOR={light:"#FBFAF8",dark:"#15181A"};
function prefersDark(){
  try{ return typeof window.matchMedia==="function" && window.matchMedia("(prefers-color-scheme: dark)").matches; }
  catch(e){ return false; }
}
function resolvedTheme(){
  const t=(S&&S.theme)||"light";
  if(t==="dark") return "dark";
  if(t==="system"&&prefersDark()) return "dark";
  return "light";
}
function applyTheme(){
  const dark=resolvedTheme()==="dark";
  try{
    const root=document.documentElement;
    if(dark) root.setAttribute("data-theme","dark"); else root.removeAttribute("data-theme");
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content",dark?THEME_COLOR.dark:THEME_COLOR.light);
  }catch(e){}
}
function watchSystemTheme(){
  try{
    if(typeof window.matchMedia!=="function") return;
    const mq=window.matchMedia("(prefers-color-scheme: dark)");
    const onChange=()=>{ if(S.theme==="system"){ applyTheme(); render(); } };
    if(mq.addEventListener) mq.addEventListener("change",onChange);
    else if(mq.addListener) mq.addListener(onChange);   // older Safari
  }catch(e){}
}

// Quests are picked from the date, so a reload never reshuffles the day's work.
function rollQuests(d){
  if(S.game.quests&&S.game.quests.day===d&&(S.game.quests.items||[]).length) return;
  let seed=0; for(const ch of d) seed=(seed*31+ch.charCodeAt(0))&0xffff;
  const pool=[...QUEST_POOL], items=[];
  for(let i=0;i<3&&pool.length;i++){
    const pick=pool.splice(seed%pool.length,1)[0];
    seed=(seed*7+13)&0xffff;
    const n=pick.need();
    items.push({id:pick.id,label:pick.label(n),need:n,have:0,done:false});
  }
  S.game.quests={day:d,items};
}
function regenHearts(){
  if(!S.game.opts.hearts){ S.game.hearts=HEART_MAX; return; }
  if(S.game.hearts>=HEART_MAX){ S.game.heartTs=null; return; }
  if(!S.game.heartTs){ S.game.heartTs=Date.now(); return; }
  const gained=Math.floor((Date.now()-S.game.heartTs)/HEART_MS);
  if(gained>0){
    S.game.hearts=Math.min(HEART_MAX,S.game.hearts+gained);
    S.game.heartTs=S.game.hearts>=HEART_MAX?null:S.game.heartTs+gained*HEART_MS;
  }
}
const heartsLeft=()=>{ ensureGame(); return S.game.opts.hearts?S.game.hearts:HEART_MAX; };

  if(!S.game.heartTs||S.game.hearts>=HEART_MAX) return "";

async function runPython(code){

  catch(e){ return {ok:false,output:out.join("\n"),error:String(e.message||e).split("\n").filter(Boolean).slice(-3).join("\n")}; }

async function runJS(code){

  const shim={log:(...a)=>out.push(a.map(fmt).join(" ")),error:(...a)=>out.push(a.map(fmt).join(" ")),warn:()=>{},info:(...a)=>out.push(a.map(fmt).join(" "))};
  try{

/* R runs on WebR (R compiled to WASM). It needs no cross-origin isolation, so
   it works on GitHub Pages exactly as it does locally — verified, not assumed. */
let webR=null, webRTried=false;
const WEBR_BASE="https://webr.r-wasm.org/latest/";
const rInstalled=new Set();
async function bootR(){
  if(webR) return webR;
  try{
    const mod=await import(WEBR_BASE+"webr.mjs");
    const w=new mod.WebR({interactive:false});
    await w.init();
    webR=w; return webR;
  }catch(e){
    webRTried=true;
    throw new Error(online()?"R runtime unreachable":"no connection");
  }
}
async function ensureRPkgs(pkgs){
  const want=(pkgs||[]).filter(p=>!rInstalled.has(p));
  if(!want.length) return;
  const w=await bootR();
  await w.installPackages(want,true);
  want.forEach(p=>rInstalled.add(p));
}
async function runR(code,pkgs){
  const w=await bootR();
  if(pkgs&&pkgs.length) await ensureRPkgs(pkgs);
  let shelter=null;
  try{
    shelter=await new w.Shelter();
    // captureConditions:false keeps the transcript console-faithful: an R error
    // arrives as the "Error: ..." line R itself prints instead of a JS throw.
    const cap=await shelter.captureR(code,{withAutoprint:true,captureConditions:false});
    const lines=cap.output.filter(o=>o.type==="stdout"||o.type==="stderr");
    const out=lines.map(o=>o.data).join("\n");
    const bad=lines.find(o=>o.type==="stderr"&&/^Error\b/.test(o.data));
    return bad?{ok:false,output:out,error:bad.data}:{ok:true,output:out};
  }catch(e){
    return {ok:false,output:"",error:String((e&&e.message)||e)};
  }finally{ if(shelter){ try{shelter.purge();}catch(e){} } }
}

/* ============ static checks ============ */
function lint(lang,code){
  const lines=code.split("\n"), f=[];
  const longest=Math.max(...lines.map(l=>l.length));
  if(longest>95) f.push({k:"readability",m:`A line runs ${longest} characters. Break it up.`});
  const names=[...code.matchAll(/\b([a-zA-Z_]\w*)\s*=[^=]/g)].map(m=>m[1]);
  const terse=names.filter(n=>n.length<=2&&!["i","j","k","n","x","y"].includes(n));
  if(terse.length) f.push({k:"readability",m:`Names like "${terse[0]}" say nothing. Spell them out.`});
  if(lang==="python"){
    if(/range\(\s*len\(/.test(code)) f.push({k:"idiomatic",m:"range(len(x)) is a C loop wearing Python. Iterate the items, or use enumerate()."});
    if(/==\s*(True|False)\b/.test(code)) f.push({k:"idiomatic",m:"Test truthiness directly — `if flag:` not `if flag == True:`."});
    if(/\+=\s*["']/.test(code)&&/\bfor\b/.test(code)) f.push({k:"efficiency",m:"Building a string with += in a loop reallocates every pass. Collect into a list, then .join()."});
    if(lines.length>15&&!/\bdef\b/.test(code)) f.push({k:"readability",m:"Fifteen-plus lines with no function. Give the logic a name."});
  }
  if(lang==="javascript"){
    if(/\bvar\b/.test(code)) f.push({k:"idiomatic",m:"`var` is legacy. Use const, or let when you genuinely reassign."});
    if(/[^=!<>]==[^=]/.test(code)) f.push({k:"idiomatic",m:"Use === . Loose equality coerces types and will bite you."});
    if(/for\s*\(\s*(let|var)\s+\w+\s*=\s*0/.test(code)&&/\.push\(/.test(code)) f.push({k:"idiomatic",m:"An index loop that pushes into an array is usually .map() or .filter()."});
  }
  if(lang==="mermaid"){
    if(!/^\s*(flowchart|graph|sequenceDiagram|classDiagram|stateDiagram|gantt|erDiagram)/m.test(code)) f.push({k:"correctness",m:"No diagram type declared on the first line."});
    if(!/(-->|->>|---|-\.->|==>)/.test(code)) f.push({k:"correctness",m:"No edges found. A diagram with no connections is not a diagram."});
  }
  if(lang==="r"){
    if(/=\s*(?!=)/.test(code)&&!/<-/.test(code)) f.push({k:"idiomatic",m:"R convention is <- for assignment, not =."});
    if(/for\s*\(/.test(code)) f.push({k:"idiomatic",m:"Explicit for loops are rare in R. Reach for the apply family or a vectorised operation."});
  }
  return f;
}
function gradeIt(lang,code,ex,t){
  const f=lint(lang,code), pick=k=>{const hit=f.find(x=>x.k===k);return hit&&hit.m;};
  let correctness=3, note="Not auto-verifiable — check your output against Expected yourself.";
  if(ex){
    if(!ex.ok){ correctness=1; note="It crashed: "+ex.error; }
    else if(t.o!=null){
      const hit=norm(ex.output)===norm(t.o);
      correctness=hit?5:2;
      note=hit?"Output matches exactly.":`Ran clean, but printed "${(ex.output||"nothing").trim()}" instead of "${t.o}".`;
    } else { correctness=4; note="Ran cleanly. No exact-output check for this one."; }
  }
  const sub=(k,good)=>pick(k)?3:good;
  return {
    scores:{correctness,readability:sub("readability",4),idiomatic:sub("idiomatic",4),efficiency:sub("efficiency",5)},
    notes:{
      correctness:pick("correctness")||note,
      readability:pick("readability")||"Nothing structural to flag.",
      idiomatic:pick("idiomatic")||"Reads like the language.",
      efficiency:pick("efficiency")||"Not relevant at this size.",
    },
    verdict: correctness===5?"Correct output, verified by running it."
      : correctness===1?"It does not run. Fix the error before worrying about style."
      : correctness===2?"Output did not match. Read the diff line by line."
      : "Graded on static checks only — no runtime available for this language.",
    mastered: correctness>=4,
  };
}

async function submit(){
  const code=$("#code").value;
  if(!code.trim()||!task) return;
  ensureGame();
  // Hearts gate graded attempts only. Reading and lessons are never blocked.
  if(heartsLeft()<=0){
    banner=`Out of hearts. One comes back in ${heartETA()} — keep reading in the meantime, or switch hearts off in the ledger.`;
    sfx("wrong"); render(); return;
  }
  stopTimer(); busy="Running your code…"; banner=null; render();
  const kind=LANGS[S.lang].runs;
  exec=null;
  if(kind==="native"){ exec=await runJS(code); }
  else if(kind==="pyodide"){
    busy = pyodide?"Running your code…":(online()?"Booting Python — one-time ~20s download":"Checking for the Python runtime…"); render();
    try{ exec=await runPython(code); }
    catch(e){
      S.queue.push({date:today(),lang:S.lang,concept:task.c,title:task.t,code,expected:task.o,secs,book:task.book||null}); persist();
      banner=`Python could not run (${e.message}). Your submission is queued — reconnect and tap "Grade queued" to run it for real. Static checks below still apply.`;
    }
  }
  else if(kind==="webr"){
    busy = webR?"Running your code…":(online()?"Booting R — one-time download":"Checking for the R runtime…"); render();
    try{ exec=await runR(code,task.pkgs); }
    catch(e){
      S.queue.push({date:today(),lang:S.lang,concept:task.c,title:task.t,code,expected:task.o,secs,book:task.book||null,pkgs:task.pkgs||null}); persist();
      banner=`R could not run (${e.message}). Your submission is queued — reconnect and tap "Grade queued" to run it for real. Static checks below still apply.`;
    }
  }
  grade=gradeIt(S.lang,code,exec,task);
  logSession(grade);
  busy=null; render();
  setTimeout(()=>{const n=$("#gradecard"); if(n&&n.scrollIntoView)n.scrollIntoView({behavior:"smooth",block:"start"});},60);
}
function logSession(g){
  ensureGame();
  const mins=Math.max(1,Math.round(secs/60)), d=today();
  const gap=S.streak.last?dayGap(S.streak.last,d):null;
  const prevStreak=S.streak.count;
  S.streak={count:gap===0?S.streak.count:gap===1?S.streak.count+1:1,last:d};
  if(S.streak.count>prevStreak&&S.streak.count>1) toast("streak",`${S.streak.count}-day streak`);
  S.sessions.unshift({date:d,lang:S.lang,mins,topic:task.c,score:g.scores.correctness,verdict:g.verdict});
  const solid=S.solid[S.lang]||[], shaky=S.shaky[S.lang]||[];
  const pass=g.mastered&&g.scores.correctness>=4;
  S.solid[S.lang]=pass?[...new Set([...solid,task.c])]:solid;
  S.shaky[S.lang]=pass?shaky.filter(c=>c!==task.c):[...new Set([...shaky,task.c])];

  let firstTime=true, finishedChapter=false;
  if(task.book&&pass){
    ensureBook();
    const arr=S.book.ex[task.book]||[];
    firstTime=!arr.includes(task.t);
    if(firstTime) arr.push(task.t);
    S.book.ex[task.book]=arr;
    finishedChapter=firstTime&&chapterDone(task.book);
  }

  if(pass){
    S.game.combo=(S.game.combo||0)+1;
    S.game.bestCombo=Math.max(S.game.bestCombo||0,S.game.combo);
    bumpQuest("ex",1); bumpQuest("combo",S.game.combo); bumpQuest("mins",mins);
    const gained=task.book?(firstTime?XP.exercise:XP.repeat):XP.drill;
    const bonus=S.game.combo>=3?Math.min(10,S.game.combo):0;
    awardXP(gained+bonus,"exercise");
    sfx("right"); buzz(18);
    if(finishedChapter){
      const ch=chapterById(task.book);
      awardXP(XP.chapter,"chapter");
      badgeEarned("chapter");
      party={title:"Chapter complete",sub:ch?`${ch.n}. ${ch.title}`:"",xp:gained+bonus+XP.chapter,
             lines:[`${ch?ch.exercises.length:0} exercises passed`,`Streak: ${S.streak.count} days`]};
      sfx("done");
    }
  }else{
    S.game.combo=0;
    loseHeart();
    sfx("wrong"); buzz([12,40,12]);
  }
  persist();
}
async function drainQueue(){
  if(!S.queue.length) return;
  busy="Grading queued submissions…"; render();
  const still=[];
  for(const q of S.queue){
    const kind=(LANGS[q.lang]||{}).runs;
    if(kind!=="pyodide"&&kind!=="webr"){ still.push(q); continue; }
    try{
      const ex = kind==="webr" ? await runR(q.code,q.pkgs) : await runPython(q.code);
      const g=gradeIt(q.lang,q.code,ex,{o:q.expected});
      const solid=S.solid[q.lang]||[], shaky=S.shaky[q.lang]||[];
      const pass=g.mastered;
      S.sessions.unshift({date:q.date,lang:q.lang,mins:Math.max(1,Math.round(q.secs/60)),topic:q.concept,score:g.scores.correctness,verdict:"(queued) "+g.verdict});
      S.solid[q.lang]=pass?[...new Set([...solid,q.concept])]:solid;
      S.shaky[q.lang]=pass?shaky.filter(c=>c!==q.concept):[...new Set([...shaky,q.concept])];
      if(q.book&&pass){
        ensureBook();
        const arr=S.book.ex[q.book]||[];
        if(!arr.includes(q.title)) arr.push(q.title);
        S.book.ex[q.book]=arr;
        awardXP(XP.exercise,"Queued exercise");
      }
    }catch(e){ still.push(q); }
  }
  S.queue=still; persist();
  busy=null; banner=still.length?`${still.length} still pending — the runtime is still unreachable.`:"Queue cleared. Results are in the ledger.";
  render();
}
/* ============ book actions ============ */
function ensureBook(){ if(!S.book||typeof S.book!=="object") S.book={last:null,read:{},ex:{}};
  if(!S.book.read) S.book.read={}; if(!S.book.ex) S.book.ex={}; }
function chRead(chId){ return (S.book&&S.book.read&&S.book.read[chId])||{}; }
function bookExDone(chId){ return (S.book&&S.book.ex&&S.book.ex[chId])||[]; }
function firstUnread(chId){
  const ch=chapterById(chId); if(!ch) return 0;
  const r=chRead(chId);
  for(let i=0;i<ch.sections.length;i++) if(!r[i]) return i;
  return ch.sections.length-1;
}
function openBook(chId,sec){
  view="book"; bookCh=chId;
  if(S.lang!=="python"){ S.lang="python"; persist(); }
  render();
  const target=sec!=null?sec:firstUnread(chId);
  setTimeout(()=>{const n=$("#bsec"+target); if(n&&n.scrollIntoView)n.scrollIntoView({behavior:"smooth",block:"start"});},60);
}
function markRead(chId,i){
  ensureBook();
  if(!S.book.read[chId]) S.book.read[chId]={};
  const fresh=!S.book.read[chId][i];
  S.book.read[chId][i]=true;
  const ch=chapterById(chId);
  S.book.last={ch:chId,sec:Math.min(i+1,(ch?ch.sections.length:1)-1)};
  if(fresh){ ensureGame(); bumpQuest("read",1); awardXP(XP.section,"section"); sfx("right"); buzz(10);
    if(chapterDone(chId)){ awardXP(XP.chapter,"chapter"); badgeEarned("chapter");
      party={title:"Chapter complete",sub:ch?`${ch.n}. ${ch.title}`:"",xp:XP.section+XP.chapter,
             lines:["Every section read","Every exercise passed"]}; sfx("done"); } }
  persist(); render();
}
function startBookExercise(chId,i){
  const ch=chapterById(chId); if(!ch||!ch.exercises[i]) return;
  const lang=bookLangOf(chId);
  if(S.lang!==lang){ S.lang=lang; persist(); }
  task=clone(ch.exercises[i]); task.book=chId;
  // R exercises declare the packages WebR must install before grading.
  if(ch.pkgs&&ch.pkgs.length) task.pkgs=clone(ch.pkgs);
  lesson=null; hintTier=0; exec=null; grade=null; banner=null; secs=0; view="practice";
  startTimer(); render();
  setTimeout(()=>{const n=$("#taskcard"); if(n&&n.scrollIntoView)n.scrollIntoView({behavior:"smooth",block:"start"});},60);
}

/* ============ PWA: install + offline runtime ============ */
let swReg=null, cachedFiles=0;
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(r=>{swReg=r; askRuntime();}).catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{
    if(e.data&&e.data.type==="runtime-status"){ cachedFiles=e.data.files; render(); }
  });
}
function askRuntime(){ if(navigator.serviceWorker&&navigator.serviceWorker.controller)
  navigator.serviceWorker.controller.postMessage("runtime-status"); }
function standalone(){
  try{
    if(window.navigator&&window.navigator.standalone===true) return true;
    if(typeof window.matchMedia==="function") return window.matchMedia("(display-mode: standalone)").matches;
  }catch(e){}
  return false;
}

async function cacheRuntime(){
  if(!online()){ banner="Connect to wifi first — this downloads about 12 MB."; render(); return; }
  busy="Downloading Python runtime…"; banner=null; render();
  try{
    await bootPython();
    await runPython("print('ready')");
    banner="Python runtime cached. It will now work with no signal.";
  }catch(e){ banner="Could not cache the runtime: "+e.message; }
  busy=null; askRuntime(); render();
}
async function cacheR(){
  if(!online()){ banner="Connect to wifi first — this downloads the R runtime."; render(); return; }
  busy="Downloading R runtime…"; banner=null; render();
  try{
    await bootR();
    await runR("cat('ready')");
    banner="R runtime cached. It will now work with no signal.";
  }catch(e){ banner="Could not cache R: "+e.message; }
  busy=null; askRuntime(); render();
}

/* ============ highlighting ============ */
// Highlights are stored as character-offset ranges per prose block, keyed by
// lang|concept|idx, inside S (one writer: persist()). Selection API is guarded.
function hlSpans(key, txt){
  const ranges=(S.highlights&&S.highlights[key])||[];
  if(!ranges.length) return [txt];
  const sorted=[...ranges].sort((a,b)=>a[0]-b[0]);
  const nodes=[]; let pos=0;
  for(const r of sorted){
    const a=Math.max(0,Math.min(r[0],txt.length)), b=Math.max(a,Math.min(r[1],txt.length));
    if(a>pos) nodes.push(txt.slice(pos,a));
    nodes.push(el("mark",{class:"hl",title:"Tap to remove",onclick:(ev)=>{ev.stopPropagation();removeHighlight(key,r[0],r[1]);}},txt.slice(a,b)));
    pos=b;
  }
  if(pos<txt.length) nodes.push(txt.slice(pos));
  return nodes;
}
function hlElK(tag, cls, key, txt){
  return el(tag,{class:cls,"data-hl":key}, ...hlSpans(key,txt));
}
function hlEl(tag, cls, concept, idx, txt){
  return hlElK(tag, cls, S.lang+"|"+concept+"|"+idx, txt);
}
function mergeRanges(rs){
  const s=[...rs].sort((a,b)=>a[0]-b[0]); const out=[];
  for(const r of s){ const last=out[out.length-1];
    if(last&&r[0]<=last[1]) last[1]=Math.max(last[1],r[1]); else out.push([r[0],r[1]]); }
  return out;
}
function removeHighlight(key,a,b){
  if(!S.highlights||!S.highlights[key]) return;
  const arr=S.highlights[key].filter(r=>!(r[0]===a&&r[1]===b));
  if(arr.length) S.highlights[key]=arr; else delete S.highlights[key];
  persist(); render();
}
let hlBtn=null;
function ensureHlBtn(){
  if(hlBtn) return hlBtn;
  hlBtn=el("button",{id:"hlbtn"},"Highlight");
  hlBtn.addEventListener("mousedown",(e)=>e.preventDefault());
  hlBtn.addEventListener("click",(e)=>{e.preventDefault();e.stopPropagation();applyHighlight();});
  document.body.appendChild(hlBtn);
  return hlBtn;
}
function hideHlBtn(){ if(hlBtn) hlBtn.style.display="none"; }
function selHost(){
  if(!window.getSelection) return null;
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount) return null;
  const range=sel.getRangeAt(0);
  if(!range.toString().trim()) return null;
  let node=range.commonAncestorContainer;
  if(node.nodeType===3) node=node.parentNode;
  const host=node&&node.closest?node.closest("[data-hl]"):null;
  if(!host) return null;
  if(!host.contains(range.startContainer)||!host.contains(range.endContainer)) return null;
  return {sel,range,host};
}
function showHlBtn(){
  const s=selHost();
  if(!s){ hideHlBtn(); return; }
  const b=ensureHlBtn();
  let rect; try{ rect=s.range.getBoundingClientRect(); }catch(e){ hideHlBtn(); return; }
  if(!rect||(!rect.width&&!rect.height)){ hideHlBtn(); return; }
  b.style.display="block";
  const bw=b.offsetWidth||90, vw=window.innerWidth||360;
  let left=rect.left+rect.width/2-bw/2;
  left=Math.max(6,Math.min(left, vw-bw-6));
  let top=rect.top-b.offsetHeight-8;
  if(top<6) top=rect.bottom+8;
  b.style.left=left+"px"; b.style.top=top+"px";
}
function applyHighlight(){
  const s=selHost();
  if(!s){ hideHlBtn(); return; }
  const key=s.host.getAttribute("data-hl");
  const pre=document.createRange();
  try{ pre.selectNodeContents(s.host); pre.setEnd(s.range.startContainer,s.range.startOffset); }
  catch(e){ hideHlBtn(); return; }
  const start=pre.toString().length;
  const end=start+s.range.toString().length;
  if(end<=start){ hideHlBtn(); return; }
  if(!S.highlights) S.highlights={};
  const arr=S.highlights[key]?[...S.highlights[key]]:[];
  arr.push([start,end]);
  S.highlights[key]=mergeRanges(arr);
  persist();
  try{ s.sel.removeAllRanges(); }catch(e){}
  hideHlBtn(); render();
}
let hlWired=false;
function wireHighlighting(){
  if(hlWired) return; hlWired=true;
  try{
    const onUp=()=>setTimeout(showHlBtn,10);
    document.addEventListener("mouseup",onUp);
    document.addEventListener("touchend",onUp);
    document.addEventListener("selectionchange",()=>{ if(!selHost()) hideHlBtn(); });
    window.addEventListener("scroll",hideHlBtn,true);
  }catch(e){}
}
