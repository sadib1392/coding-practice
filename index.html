function render(){
  ensureGame();
  const app=$("#app"); app.innerHTML="";
  const solid=S.solid[S.lang]||[], shaky=S.shaky[S.lang]||[];
  const totalMins=S.sessions.reduce((a,s)=>a+s.mins,0);

  app.append(el("header",{},
    el("h1",{},"Practice Log"),
    el("div",{class:"meta"},`${totalMins} MIN · ${online()?"ONLINE":"OFFLINE"}`)
  ));
  renderStats(app);

  const nav=el("nav",{});
  for(const[k,v]of Object.entries(LANGS))
    nav.append(el("button",{class:"tab"+(S.lang===k?" on":""),onclick:()=>{S.lang=k;persist();task=null;lesson=null;exec=null;grade=null;stopTimer();render();}},v.tag+(v.star?" ★":"")));
  nav.append(el("span",{style:"flex:1"}));
  [["practice","PRACTICE"],["book","BOOK"],["ledger","LEDGER"]].forEach(([v,label])=>
    nav.append(el("button",{class:"tab"+(view===v?" on":""),onclick:()=>{view=v;render();}},label)));
  app.append(nav);

  if(banner) app.append(el("div",{class:"card banner"},banner));
  if(S.queue.length) app.append(el("div",{class:"card"},
    el("span",{class:"lab"},`${S.queue.length} submission${S.queue.length>1?"s":""} awaiting real execution`),
    el("button",{class:"ghost",style:"margin-top:10px",onclick:drainQueue},"Grade queued")));

  if(view==="ledger"){ renderLedger(app,solid,shaky); }
  else if(view==="book"){ renderBook(app); }
  else{
    // continue-the-book card
    const lastB=S.book&&S.book.last, lastCh=lastB&&chapterById(lastB.ch);
    if(lastCh){
      const r=chRead(lastB.ch), readN=Object.keys(r).filter(k=>r[k]).length;
      app.append(el("div",{class:"card"},
        el("span",{class:"lab"},"Book · pick up where you left off"),
        el("div",{style:"font-size:17px;margin-top:6px"},`Chapter ${lastCh.n}: ${lastCh.title}`),
        el("div",{class:"meta",style:"margin-top:4px"},`${readN} / ${lastCh.sections.length} sections read · next: ${lastCh.sections[Math.min(lastB.sec,lastCh.sections.length-1)].t}`),
        el("button",{class:"ghost",style:"margin-top:12px",onclick:()=>openBook(lastB.ch)},"Continue reading")));
    }
    // timer
    const bar=el("i",{id:"bar",style:`width:${Math.min(100,secs/900*100)}%`});
    const tcard=el("div",{class:"card"},
      el("div",{class:"row",style:"margin-bottom:8px"},
        el("span",{class:"lab"},"Today's 15 minutes"),
        el("span",{id:"clock",class:"clock"+(secs>=900?" teal":"")},fmtClock())),
      el("div",{class:"bar"},bar));
    if(task) tcard.append(el("button",{class:"ghost",style:"margin-top:10px",onclick:()=>{running?stopTimer():startTimer();render();}},running?"Pause":"Resume"));
    app.append(tcard);

    // milestone
    const runs=LANGS[S.lang].runs;
    const nc=nextConcept();
    const mile=el("div",{class:"card"},
      el("span",{class:"lab"},"Next milestone"),
      el("div",{style:"font-size:18px;font-weight:400;margin-top:6px"},nc),
      el("div",{class:"meta",style:"margin-top:4px"},
        `${solid.length} / ${LADDER[S.lang].length} cleared · ${runs==="native"?"graded by running your code":(runs==="pyodide"||runs==="webr")?"graded by running your code (needs runtime)":"static checks only"}`));
    if(LESSONS[S.lang]&&LESSONS[S.lang][nc])
      mile.append(el("button",{class:"ghost",style:"margin-top:14px",onclick:teach},"Teach me this"));
    mile.append(el("button",{class:"primary",onclick:newTask},task?"Next exercise":"Give me an exercise"));
    app.append(mile);

    if(lesson) renderLesson(app);
    if(task) renderTask(app);
    if(exec) renderRun(app);
    if(grade) renderGrade(app);
  }

  const foot=el("footer",{});
  const ready = cachedFiles>0 || !!pyodide;
  foot.append(el("div",{},
    ready ? "Python and R runtimes are cached once downloaded — they run with no signal. JavaScript always has."
          : "JavaScript runs fully offline. Python and R each need their runtime cached once while connected."));
  const acts=el("div",{style:"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"});
  if(!ready) acts.append(el("button",{class:"ghost",onclick:cacheRuntime},"Cache Python for offline (~12 MB)"));
  if(!webR) acts.append(el("button",{class:"ghost",onclick:cacheR},"Cache R for offline"));
  acts.append(el("button",{class:"ghost",onclick:exportData},"Export progress"));
  foot.append(acts);
  if(!standalone()) foot.append(el("div",{style:"margin-top:14px"},
    "Not installed yet. iOS: Share \u2192 Add to Home Screen. Android: menu \u2192 Install app."));
  app.append(foot);
  drawToasts(); drawParty();
}

/* The always-visible scoreboard: streak, XP, level, hearts, daily goal. */

  const g=S.game, li=levelInfo(g.xp);
  const bar=el("div",{class:"stats"});
  bar.append(el("div",{class:"stat",title:"Day streak"},
    el("span",{class:"flame"},"◆"), el("span",{class:"n"},String(S.streak.count||0))));
  bar.append(el("div",{class:"stat",title:"Total XP"},
    el("span",{class:"gem"},"✦"), el("span",{class:"n"},String(g.xp))));
  const hearts=el("div",{class:"stat",title:g.opts.hearts?(heartsLeft()<HEART_MAX?("Next heart in "+heartETA()):"Hearts full"):"Hearts are off"});

function drawToasts(){
  let host=$("#toasts");
  if(!host){ host=el("div",{id:"toasts"}); document.body.appendChild(host); }
  host.innerHTML="";
  if(!fx.length) return;
  fx.forEach(t=>host.append(el("div",{class:"toast "+(t.kind==="badge"?"badge-t":t.kind==="level"?"level-t":"")},t.text)));
  const mine=fx.slice();
  setTimeout(()=>{ fx=fx.filter(t=>!mine.includes(t)); const h=$("#toasts"); if(h) h.innerHTML=""; },2600);
}

function drawParty(){
  const old=$("#party"); if(old) old.remove();
  const oldC=$("#confetti"); if(oldC) oldC.remove();
  if(!party) return;
  const p=party;
  const box=el("div",{id:"party"});
  box.append(el("div",{style:"font-size:52px"},"✦"));
  box.append(el("h2",{},p.title));
  if(p.sub) box.append(el("p",{class:"note",style:"margin:0 0 8px"},p.sub));
  box.append(el("div",{class:"xpbig"},"+"+p.xp+" XP"));
  (p.lines||[]).forEach(l=>box.append(el("p",{class:"note",style:"margin:2px 0"},l)));
  box.append(el("button",{class:"primary",style:"max-width:280px;margin-top:22px",
    onclick:()=>{party=null;render();}},"Keep going"));
  document.body.appendChild(box);
  confetti();
}

/* Canvas confetti — no library, no assets. Skipped when motion is reduced. */
function confetti(){
  let reduced=false;
  try{ if(typeof window.matchMedia==="function") reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  if(reduced||!S.game.opts.motion) return;
  const cv=el("canvas",{id:"confetti"});
  document.body.appendChild(cv);
  const w=cv.width=window.innerWidth||360, h=cv.height=window.innerHeight||640;
  const ctx=cv.getContext&&cv.getContext("2d"); if(!ctx){ cv.remove(); return; }
  // Read the live palette so confetti stays visible on whichever theme is on.
  let cols=["#137565","#976708","#B03428","#2E3330"];
  try{
    const cs=getComputedStyle(document.documentElement);
    const pick=(n,f)=>{ const v=cs.getPropertyValue(n).trim(); return v||f; };
    cols=[pick("--teal",cols[0]),pick("--gold",cols[1]),pick("--sig",cols[2]),pick("--ink",cols[3])];
  }catch(e){}
  const bits=[];
  for(let i=0;i<90;i++) bits.push({x:Math.random()*w,y:-20-Math.random()*h*0.5,
    vx:(Math.random()-0.5)*2.2,vy:2+Math.random()*3.4,s:4+Math.random()*6,
    c:cols[i%cols.length],r:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.25});
  let frames=0;
  (function step(){
    frames++;
    ctx.clearRect(0,0,w,h);
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.r+=b.vr;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r);
      ctx.fillStyle=b.c; ctx.fillRect(-b.s/2,-b.s/2,b.s,b.s*0.6); ctx.restore(); });
    if(frames<210&&document.getElementById("confetti")) requestAnimationFrame(step);
    else cv.remove();
  })();
}

function renderLesson(app){
  const data=(LESSONS[S.lang]||{})[lesson];
  const c=el("div",{class:"card",id:"lessoncard"});
  c.append(el("span",{class:"lab"},"Lesson · "+LANGS[S.lang].label),el("h2",{},lesson));
  if(!data){ c.append(el("p",{class:"brief"},"No lesson written for this concept yet.")); app.append(c); return; }
  if(window.getSelection) c.append(el("div",{class:"meta",style:"margin:-4px 0 12px"},"Select any text to highlight it · tap a highlight to remove"));

  // lede
  c.append(hlEl("p","brief",lesson,"i",data.i));

  // reading
  if(data.read&&data.read.length){
    const rd=el("div",{style:"margin-top:18px"});
    rd.append(el("span",{class:"lab",style:"margin-bottom:10px"},"Reading"));
    data.read.forEach((para,k)=>rd.append(hlEl("p","read",lesson,"r"+k,para)));
    c.append(rd);
  }

  // syntax
  const syn=el("div",{style:"margin-top:16px"});
  syn.append(el("span",{class:"lab"},"Syntax"));
  data.s.forEach(([code,desc],k)=>{
    syn.append(el("pre",{style:"margin-top:12px"},code));
    syn.append(hlEl("p","note",lesson,"s"+k,desc));
  });
  c.append(syn);

  // common mistakes
  const warn=el("div",{style:"margin-top:16px"});
  warn.append(el("span",{class:"lab"},"Common mistakes"));
  data.w.forEach((g,k)=>warn.append(hlEl("div","hint",lesson,"w"+k,g)));
  c.append(warn);

  // practice: predict the output
  if(data.practice&&data.practice.length){
    const pr=el("div",{style:"margin-top:20px"});
    pr.append(el("span",{class:"lab"},"Practice · predict the output"));
    pr.append(el("p",{class:"note",style:"margin-top:4px"},"Read the code, decide what it prints, then reveal the answer. These are warm-ups — the graded exercise comes after."));
    data.practice.forEach((p)=>{
      const box=el("div",{class:"prob"});
      box.append(el("pre",{},p.code));
      const ans=el("div",{style:"display:none;margin-top:10px"});
      ans.append(el("span",{class:"lab"},"Output"),el("pre",{class:"teal",style:"margin-top:6px"},p.out));
      if(p.why) ans.append(el("p",{class:"why"},p.why));
      const btn=el("button",{class:"ghost",style:"margin-top:10px"},"Reveal output");
      btn.addEventListener("click",()=>{
        const shown=ans.style.display!=="none";
        ans.style.display=shown?"none":"block";
        btn.textContent=shown?"Reveal output":"Hide output";
      });
      box.append(btn,ans);
      pr.append(box);
    });
    c.append(pr);
  }

  c.append(el("button",{class:"primary",onclick:newTask},"Give me an exercise on this"));
  app.append(c);
}
function renderTask(app){
  const c=el("div",{class:"card",id:"taskcard"});
  const chOfTask=task.book&&chapterById(task.book);
  c.append(el("span",{class:"lab"},chOfTask?`Book exercise · Chapter ${chOfTask.n} · ${task.c}`:task.c),el("h2",{},task.t),el("p",{class:"brief"},task.b));
  c.append(el("div",{style:"margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)"},
    el("span",{class:"lab"},task.o!=null?"Expected output · checked automatically":"Expected result · not auto-checkable"),
    el("pre",{},task.o??"—")));
  const hints=el("div",{style:"margin-top:14px"});
  task.h.slice(0,hintTier).forEach((h,i)=>hints.append(el("div",{class:"hint"},el("b",{},"TIER "+(i+1)),el("br"),h)));
  if(hintTier<task.h.length) hints.append(el("button",{class:"ghost",onclick:()=>{hintTier++;render();}},hintTier===0?"I'm stuck — nudge me":"Next hint"));
  c.append(hints);
  const ta=el("textarea",{id:"code",spellcheck:"false",autocapitalize:"off",autocorrect:"off",placeholder:`Write your ${LANGS[S.lang].label} here…`});
  ta.value = window._draft || "";
  ta.addEventListener("input",e=>{window._draft=e.target.value;});
  ta.addEventListener("focus",()=>{if(!running&&!grade)startTimer();});
  c.append(ta);
  c.append(el("button",{class:"primary",disabled:busy?"":null,onclick:submit},busy||(LANGS[S.lang].runs?"Run and grade":"Check and grade")));
  app.append(c);
}

function renderRun(app){
  const pass=exec.ok&&task.o!=null&&norm(exec.output)===norm(task.o);
  const cls=pass?"teal":"sig";
  const c=el("div",{class:"card thick",style:`border-color:var(--${pass?"teal":"sig"})`});
  c.append(el("div",{class:"row"},el("span",{class:"lab"},"Execution"),
    el("span",{class:cls,style:"font-size:13px;font-weight:500;letter-spacing:.06em"},
      !exec.ok?"ERROR":task.o==null?"RAN":pass?"PASS":"MISMATCH")));
  if(!exec.ok){ c.append(el("span",{class:"lab",style:"margin-top:10px"},"Traceback"),el("pre",{class:"sig"},exec.error)); }
  c.append(el("span",{class:"lab",style:"margin-top:10px"},"Your output"),el("pre",{},exec.output||"(nothing printed)"));
  if(task.o!=null&&!pass) c.append(el("span",{class:"lab",style:"margin-top:10px"},"Expected"),el("pre",{class:"teal"},task.o));
  app.append(c);
}

function renderGrade(app){
  const c=el("div",{class:"card thick",id:"gradecard"});
  c.append(el("div",{class:"row"},el("span",{class:"lab"},"Graded"),
    el("span",{class:"meta"},exec?"BY EXECUTION":"STATIC ONLY")));
  ["correctness","readability","idiomatic","efficiency"].forEach(k=>{
    const v=grade.scores[k], cls=v>=4?"teal":v>=3?"gold":"sig";
    const pips=el("div",{class:"pips"});
    for(let n=1;n<=5;n++){const i=el("i");if(n<=v)i.style.background=`var(--${v>=4?"teal":v>=3?"gold":"sig"})`;pips.append(i);}
    c.append(el("div",{style:"margin-top:12px"},
      el("div",{class:"row",style:"font-size:12px;font-weight:400;letter-spacing:.06em;text-transform:uppercase"},
        el("span",{},k+(k==="correctness"&&exec?" · by execution":"")),
        el("span",{class:cls,style:"font-weight:500"},v+"/5")),
      pips, el("p",{class:"note"},grade.notes[k])));
  });
  c.append(el("p",{class:"verdict"},grade.verdict));
  app.append(c);
}

function renderBook(app){
  const chs=bookChapters();
  if(bookCh&&chs[bookCh]){ renderChapter(app,bookCh,chs[bookCh]); return; }

  const bk=curBook();
  if(!bk){ app.append(el("div",{class:"card"},el("p",{class:"note"},"No book for this language yet."))); return; }
  const META=bk.meta, ORDER=bk.order;

  const any=ORDER.some(id=>chs[id]);
  if(!any){ app.append(el("div",{class:"card"},el("p",{class:"note"},"No chapters are loaded. Chapter files live in the book/ folder and register themselves on load."))); return; }

  const loaded=ORDER.filter(id=>chs[id]);
  const doneCount=loaded.filter(id=>chapterDone(id)).length;
  const head=el("div",{class:"card"});
  head.append(el("span",{class:"lab"},"The book · "+LANGS[S.lang].label),
    el("h2",{},META.title),
    el("p",{class:"note"},`${META.author} · ${META.edition}. ${META.credit}`),
    el("div",{class:"meta",style:"margin-top:10px"},`${doneCount} / ${loaded.length} chapters complete`),
    el("div",{class:"bar",style:"margin-top:6px"},el("i",{style:`width:${Math.round(doneCount/loaded.length*100)}%;background:var(--teal)`})),
    el("div",{style:"margin-top:10px"},el("a",{href:META.url,target:"_blank",rel:"noopener",style:"color:var(--teal);font-size:14px"},"Read the original online →")));
  app.append(head);

  // The path. Chapters stay unlocked (the owner asked for that) — progression is
  // shown rather than enforced, and the next unfinished chapter pulses.
  const nextId=loaded.find(id=>!chapterDone(id));
  const wrap=el("div",{class:"card"});
  wrap.append(el("span",{class:"lab"},"Your path"));
  const path=el("div",{class:"path"});
  loaded.forEach((id,i)=>{
    const ch=chs[id];
    const r=chRead(id), total=ch.sections.length;
    const readN=Object.keys(r).filter(k=>r[k]).length;
    const exN=bookExDone(id).length, exT=ch.exercises.length;
    const done=chapterDone(id), started=readN>0||exN>0, isNext=id===nextId;
    const cls="knob "+(done?"done":isNext?"now pulse":started?"part":"");
    const knob=el("button",{class:cls,onclick:()=>openBook(id),"aria-label":`Chapter ${ch.n}: ${ch.title}`},
      el("span",{},done?"✓":String(ch.n)),
      el("span",{class:"cn"},done?"DONE":`${readN}/${total}`));
    if(done) knob.append(el("span",{class:"crown"},"♛"));
    const info=el("div",{class:"stepinfo"},
      el("div",{class:"t"},ch.title),
      el("div",{class:"m"},done?"Complete · tap to revisit":`${readN}/${total} sections · ${exN}/${exT} exercises`));
    path.append(el("div",{class:"step"+(i%2?" right":"")},knob,info));
  });
  wrap.append(path);
  app.append(wrap);
}

function renderChapter(app,chId,ch){
  const c=el("div",{class:"card",id:"bookcard"});
  c.append(el("button",{class:"ghost",style:"margin-bottom:16px",onclick:()=>{bookCh=null;render();}},"← All chapters"));
  c.append(el("span",{class:"lab"},"Chapter "+ch.n+" · "+((bookFor(bookLangOf(chId))||{meta:{}}).meta.title||"")),el("h2",{},ch.title));
  if(window.getSelection) c.append(el("div",{class:"meta",style:"margin:-2px 0 2px"},"Select any text to highlight it · tap a highlight to remove"));
  c.append(el("div",{style:"margin:8px 0 2px"},el("a",{href:ch.src,target:"_blank",rel:"noopener",style:"color:var(--teal);font-size:13px"},"Read the original chapter →")));

  const r=chRead(chId);
  ch.sections.forEach((sec,si)=>{
    const s=el("div",{id:"bsec"+si,style:"margin-top:24px;padding-top:18px;border-top:1px solid var(--rule)"});
    s.append(el("div",{style:"font-size:17px;font-weight:500;margin-bottom:10px"},sec.t));
    sec.body.forEach((blk,bi)=>{
      const k=blk[0], v=blk[1];
      if(k==="p") s.append(hlElK("p","read","book|"+chId+"|s"+si+"|b"+bi,v));
      else if(k==="code") s.append(el("pre",{style:"margin-bottom:13px"},v));
      else if(k==="note") s.append(hlElK("div","hint","book|"+chId+"|s"+si+"|b"+bi,v));
    });
    const isRead=!!r[si];
    s.append(el("button",{class:"ghost",style:"margin-top:8px"+(isRead?";color:var(--teal);border-color:var(--teal)":""),
      onclick:()=>markRead(chId,si)},isRead?"Read ✓":"Mark section as read"));
    c.append(s);
  });

  if(ch.questions&&ch.questions.length){
    const qs=el("div",{style:"margin-top:26px;padding-top:18px;border-top:1px solid var(--rule)"});
    qs.append(el("span",{class:"lab"},"Practice questions"));
    qs.append(el("p",{class:"note",style:"margin-top:4px"},"Answer from memory first, then reveal. If one surprises you, reread its section before moving on."));
    ch.questions.forEach((item,qi)=>{
      const box=el("div",{class:"prob"});
      box.append(hlElK("p","read","book|"+chId+"|q"+qi,item.q));
      const ans=el("div",{style:"display:none;margin-top:8px"});
      ans.append(el("p",{class:"why"},item.a));
      const btn=el("button",{class:"ghost",style:"margin-top:8px"},"Reveal answer");
      btn.addEventListener("click",()=>{
        const shown=ans.style.display!=="none";
        ans.style.display=shown?"none":"block";
        btn.textContent=shown?"Reveal answer":"Hide answer";
      });
      box.append(btn,ans);
      qs.append(box);
    });
    c.append(qs);
  }

  if(ch.exercises&&ch.exercises.length){
    const done=bookExDone(chId);
    const xs=el("div",{style:"margin-top:26px;padding-top:18px;border-top:1px solid var(--rule)"});
    xs.append(el("span",{class:"lab"},"Graded exercises"));
    xs.append(el("p",{class:"note",style:"margin-top:4px"},"These run your code for real. Pass them all to complete the chapter."));
    ch.exercises.forEach((ex,xi)=>{
      const passed=done.includes(ex.t);
      const box=el("div",{class:"prob"});
      box.append(el("div",{class:"row"},
        el("span",{class:"lab"},"Exercise "+(xi+1)),
        el("span",{class:passed?"teal":"meta",style:"font-size:12px"},passed?"PASSED ✓":"")));
      box.append(el("div",{style:"font-size:16px;font-weight:500;margin-top:4px"},ex.t));
      box.append(el("p",{class:"note",style:"margin-top:4px"},ex.b));
      box.append(el("button",{class:passed?"ghost":"primary",style:"margin-top:10px",onclick:()=>startBookExercise(chId,xi)},passed?"Do it again":"Start exercise"));
      xs.append(box);
    });
    c.append(xs);
  }
  app.append(c);
}

function renderLedger(app,solid,shaky){
  const g=S.game, li=levelInfo(g.xp);
  // Level + daily goal
  const top=el("div",{class:"card"});
  top.append(el("div",{class:"row"},el("span",{class:"lab"},"Level "+li.level),
    el("span",{class:"meta"},`${li.into} / ${li.span} XP to level ${li.level+1}`)));
  top.append(el("div",{class:"bar",style:"margin-top:8px"},el("i",{style:`width:${Math.round(li.into/li.span*100)}%;background:var(--teal)`})));
  top.append(el("div",{class:"row",style:"margin-top:14px"},el("span",{class:"lab"},"Today"),
    el("span",{class:"meta"},`${g.todayXp} / ${g.goal} XP`)));
  top.append(el("div",{class:"bar",style:"margin-top:6px"},el("i",{style:`width:${Math.min(100,Math.round(g.todayXp/Math.max(1,g.goal)*100))}%`})));
  const goalRow=el("div",{style:"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"});
  [20,50,100].forEach(v=>goalRow.append(el("button",{class:"ghost",style:g.goal===v?"border-color:var(--teal);color:var(--teal)":"",
    onclick:()=>{S.game.goal=v;persist();render();}},v+" XP/day")));
  top.append(goalRow);
  app.append(top);

  // Daily quests
  const q=el("div",{class:"card"},el("span",{class:"lab"},"Daily quests"));
  (g.quests.items||[]).forEach(item=>{
    const pct=Math.min(100,Math.round(item.have/item.need*100));
    q.append(el("div",{class:"quest"+(item.done?" qdone":"")},
      el("span",{style:"width:15px"},item.done?"✓":"·"),
      el("span",{style:"flex:1;font-size:14px"},item.label),
      el("span",{class:"qbar",style:"max-width:74px"},el("i",{style:`width:${pct}%`})),
      el("span",{class:"meta",style:"width:44px;text-align:right"},`${Math.min(item.have,item.need)}/${item.need}`)));
  });
  q.append(el("p",{class:"note",style:"margin-top:8px"},"Quests reset each day. Finishing one is worth "+XP.quest+" XP."));
  app.append(q);

  // Weekly XP — your own history, not a leaderboard against strangers.
  const wkCard=el("div",{class:"card"},el("span",{class:"lab"},"Last 7 days"));
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10); days.push([d,(g.hist||{})[d]||0]); }
  const peak=Math.max(10,...days.map(d=>d[1]));
  const wk=el("div",{class:"wk"});
  days.forEach(([d,v])=>wk.append(el("div",{title:`${d}: ${v} XP`},
    el("i",{style:`height:${Math.round(v/peak*100)}%;background:${v>=g.goal?"var(--teal)":"var(--gold)"}`}),
    el("span",{},d.slice(8)))));
  wkCard.append(wk);
  wkCard.append(el("p",{class:"note",style:"margin-top:8px"},`Best streak ${Math.max(S.streak.count||0,0)} days · best run of correct answers ${g.bestCombo||0}.`));
  app.append(wkCard);

  // Badges
  const bd=el("div",{class:"card"},el("span",{class:"lab"},`Badges · ${Object.keys(g.badges||{}).length} / ${BADGES.length}`));
  const list=el("div",{class:"badges"});
  BADGES.forEach(b=>{
    const on=!!g.badges[b.id];
    list.append(el("div",{class:"badge"+(on?" on":""),title:b.d},el("b",{},on?b.name:"Locked"),on?b.d:b.d));
  });
  bd.append(list);
  app.append(bd);

  // Settings
  const st=el("div",{class:"card"},el("span",{class:"lab"},"Settings"));
  const row=(label,key,note)=>{
    const on=!!g.opts[key];
    st.append(el("div",{class:"row",style:"margin-top:10px"},
      el("span",{style:"font-size:14.5px"},label),
      el("button",{class:"ghost",style:on?"border-color:var(--teal);color:var(--teal)":"",
        onclick:()=>{S.game.opts[key]=!on; if(key==="hearts"&&!S.game.opts[key]) S.game.hearts=HEART_MAX; persist(); render();}},on?"On":"Off")));
    if(note) st.append(el("p",{class:"note",style:"margin:4px 0 0"},note));
  };
  st.append(el("div",{class:"row",style:"margin-top:10px"},
    el("span",{style:"font-size:14.5px"},"Theme"),
    el("div",{style:"display:flex;gap:6px;flex-wrap:wrap"},
      [["light","Light"],["dark","Dark"],["system","System"]].map(([v,label])=>
        el("button",{class:"ghost",style:(S.theme||"light")===v?"border-color:var(--teal);color:var(--teal)":"",
          onclick:()=>setTheme(v)},label)))));
  st.append(el("p",{class:"note",style:"margin:4px 0 0"},
    "System follows your device. Light and Dark ignore it — pick one of those if your device darkens pages on its own."));
  row("Hearts","hearts","Wrong answers cost a heart. Off means unlimited attempts — reading is never blocked either way.");
  row("Sound and vibration","sound");
  row("Celebration animation","motion");
  app.append(st);

  const lad=el("div",{class:"card"},el("span",{class:"lab"},LANGS[S.lang].label+" ladder"));
  LADDER[S.lang].forEach(c=>{
    const done=solid.includes(c),weak=shaky.includes(c);
    lad.append(el("div",{class:"lad"},
      el("span",{class:done?"teal":weak?"sig":"",style:"width:16px"},done?"✓":weak?"!":"·"),
      el("span",{style:done?"":"color:var(--soft)"},c)));
  });
  app.append(lad);
  const ses=el("div",{class:"card"},el("span",{class:"lab"},"Sessions"));
  const mine=S.sessions.filter(s=>s.lang===S.lang);
  if(!mine.length) ses.append(el("p",{class:"note"},"Nothing logged in "+LANGS[S.lang].label+" yet."));
  mine.slice(0,40).forEach(s=>ses.append(el("div",{style:"padding:8px 0;border-bottom:1px solid var(--rule)"},
    el("div",{class:"row",style:"font-size:13px"},
      el("span",{},`${s.date} · ${s.topic}`),
      el("span",{class:s.score>=4?"teal":"sig"},`${s.score}/5 · ${s.mins}m`)),
    el("p",{class:"note",style:"margin-top:4px"},s.verdict))));
  app.append(ses);
}
