<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Practice Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Practice">
<meta name="theme-color" content="#FBFAF8">
<style>
  html{color-scheme:light only;}
  :root{
    color-scheme:light only;
    --paper:#FBFAF8; --card:#FFFFFF; --deep:#F4F5F2; --ink:#2E3330; --soft:#7C857F;
    --rule:#E1E4DF; --gold:#9C6A08; --sig:#B03428; --teal:#137565;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; color:var(--ink); background:var(--paper);
    font-family:var(--sans);
    padding:calc(26px + env(safe-area-inset-top)) 18px calc(60px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:660px;margin:0 auto}
  h1{font-size:18px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin:0}
  h2{font-size:20px;font-weight:500;letter-spacing:-.01em;margin:8px 0 12px;line-height:1.3}
  header{border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:22px;
    display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px}
  .meta{font-size:12px;color:var(--soft);letter-spacing:.04em}
  nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
    padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,25,22,.04)}
  .card.thick{border-width:2px}
  .lab{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
    color:var(--soft);display:block}
  .brief{font-family:var(--serif);font-size:17px;line-height:1.65;margin:0;white-space:pre-wrap}
  pre{font-family:var(--mono);font-size:14px;background:var(--deep);border:1px solid var(--rule);
    border-radius:6px;padding:12px;margin:8px 0 0;white-space:pre-wrap;line-height:1.55;overflow-x:auto}
  button{font-family:var(--sans);cursor:pointer}
  .tab{font-size:12px;font-weight:500;letter-spacing:.05em;background:transparent;color:var(--soft);
    border:1px solid var(--rule);border-radius:6px;padding:7px 12px}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .primary{font-size:15px;font-weight:500;letter-spacing:.02em;background:var(--ink);
    color:#fff;border:none;border-radius:8px;padding:14px 18px;width:100%;margin-top:14px}
  .primary:disabled{opacity:.4}
  .ghost{font-size:13px;font-weight:400;background:transparent;color:var(--ink);
    border:1px solid var(--rule);border-radius:6px;padding:9px 14px}
  textarea{width:100%;min-height:210px;margin-top:16px;padding:14px;font-family:var(--mono);
    font-size:15px;line-height:1.6;color:var(--ink);background:var(--deep);
    border:1px solid var(--rule);border-radius:8px;resize:vertical}
  .bar{height:8px;background:var(--deep);border-radius:4px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
  .clock{font-family:var(--mono);font-size:28px;font-weight:400;letter-spacing:-.02em}
  .hint{font-family:var(--serif);font-size:16px;line-height:1.6;color:var(--soft);
    border-left:3px solid var(--gold);padding-left:12px;margin-bottom:10px}
  .hint b{font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--gold)}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .pips{display:flex;gap:3px;margin:6px 0 8px}
  .pips i{flex:1;height:5px;border-radius:3px;background:var(--deep)}
  .note{font-family:var(--serif);font-size:15.5px;line-height:1.6;margin:0;color:var(--soft)}
  .verdict{font-family:var(--serif);font-size:16.5px;line-height:1.65;margin-top:18px;
    padding-top:14px;border-top:1px solid var(--rule)}
  .lad{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);
    font-size:14.5px}
  .banner{border-color:var(--sig);color:var(--sig);font-size:14px;line-height:1.6}
  footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--rule);
    font-size:12.5px;color:var(--soft);line-height:1.65}
  .teal{color:var(--teal)} .sig{color:var(--sig)} .gold{color:var(--gold)}

  /* Re-assert the light palette if the container or OS forces dark mode */
  @media (prefers-color-scheme:dark){
    html,body{color-scheme:light only;background:#FBFAF8 !important;color:#2E3330 !important}
    .card{background:#FFFFFF !important;color:#2E3330 !important}
    pre,textarea{background:#F4F5F2 !important;color:#2E3330 !important}
    .primary{background:#2E3330 !important;color:#FFFFFF !important}
    .tab.on{background:#2E3330 !important;color:#FFFFFF !important}
    .tab,.ghost{background:transparent !important}
  }
</style>
</head>

     ["nums[1:]","Everything from index 1 onward."]],
  w:["nums.sort() returns None. Writing nums = nums.sort() throws the list away.",
     "b = a does not copy the list — both names share it. Use a[:] or list(a) for a copy.",
     "append() adds one item; extend() or + adds each item of another list."]
 },
 "dicts":{
  i:"A dictionary maps keys to values. You look things up by key, not by position, and lookup stays fast no matter how big the dict gets. Keys are unique — assigning to an existing key overwrites it.",
  s:[["d = {\"a\": 1, \"b\": 2}","Maps \"a\" to 1 and \"b\" to 2."],
     ["d[\"a\"]","Looks up the value 1."],
     ["d[\"c\"] = 3","Adds a new key."],
     ["d.get(\"z\", 0)","Returns 0 instead of raising when \"z\" is missing."],
     ["\"a\" in d","Tests for a key, not a value."],
     ["d.items()","Yields (key, value) pairs."],
     ["d.keys()","The keys; d.values() gives the values."]],
  w:["d[\"z\"] raises KeyError when the key is absent. Use d.get(key, default) when it might be.",
     "in checks keys, not values.",
     "Counting things, the first sighting of a key has nothing to add to. counts[k] = counts.get(k, 0) + 1 handles it."]
 },
 "functions":{
  i:"A function packages a piece of logic under a name so you can call it repeatedly. It takes arguments, does work, and returns a value. If you write no return statement, it returns None.",
  s:[["def add(a, b):","Defines a function taking two arguments."],
     ["    return a + b","Hands a value back to the caller."],
     ["add(2, 3)","Calls it; evaluates to 5."],
     ["def greet(name=\"there\"):","name has a default value."],
     ["greet()","Uses the default: \"there\"."],
     ["x = add(1, 2)","Stores the returned value."]],
  w:["A function with no return statement returns None. print() shows a value; return hands it back — they are not the same.",
     "Do not use a mutable default like def f(x=[]) — the one list is reused across calls.",
     "Arguments match by position unless you name them: add(b=3, a=2) works by name."]
 },
 "list comprehensions":{
  i:"A list comprehension builds a list in one expression: take each item from a sequence, optionally filter it, and transform it. It replaces the common pattern of making an empty list and appending in a loop.",
  s:[["[x*2 for x in nums]","Doubles each item into a new list."],
     ["[x for x in nums if x > 0]","Keeps only the positive items."],
     ["[x*2 for x in nums if x > 0]","Filter first, then transform."],
     ["[c.upper() for c in \"abc\"]","Works over any iterable."],
     ["{x for x in nums}","Braces build a set instead."],
     ["{k: v for k, v in pairs}","A dict comprehension."]],
  w:["The if goes after the for when filtering. An if/else transform goes before the for: [a if cond else b for x in seq].",
     "A comprehension builds the whole list in memory. For huge data, a generator in round brackets streams instead.",
     "Nesting more than two fors is unreadable — fall back to a plain loop."]
 },
 "file I/O":{
  i:"Reading and writing files means opening a path in a mode, working with the file object, then closing it. The with statement opens the file and guarantees it is closed even if something fails partway through.",
  s:[["with open(\"f.txt\") as fh:","Opens for reading; closes automatically at the end."],
     ["    text = fh.read()","The whole file as one string."],
     ["fh.readlines()","A list of lines, newlines included."],
     ["for line in fh:","Iterates one line at a time."],
     ["open(\"f.txt\", \"w\")","Write mode — truncates the file first."],
     ["open(\"f.txt\", \"a\")","Append mode — keeps existing content."],
     ["fh.write(\"hi\\n\")","Writes a string; you add the newline yourself."]],
  w:["\"w\" mode erases the file the moment you open it. Use \"a\" to add without losing what is there.",
     "write() does not add a newline — include \\n yourself.",
     "Without with, an unclosed file may not flush its writes to disk. Prefer with."]
 },
 "error handling":{
  i:"When code hits something it cannot handle it raises an exception, which stops the program unless you catch it. try/except lets you attempt risky code and respond to specific failures instead of crashing.",
  s:[["try:","Starts a block that might fail."],
     ["    risky()","The code that could raise."],
     ["except ValueError:","Handles that one exception type."],
     ["except (TypeError, KeyError):","Handles either of several types."],
     ["except Exception as e:","Binds the error object to e."],
     ["finally:","Runs no matter what, error or not."],
     ["raise ValueError(\"bad\")","Raises one yourself."]],
  w:["A bare except: catches everything, including typos and Ctrl-C. Catch the specific type you expect.",
     "Do not wrap a huge block in one try. Catch around the single line that can fail, so you know what failed.",
     "Catching an error and doing nothing (pass) hides bugs. At least report it."]
 },
 "classes":{
  i:"A class is a blueprint for objects that bundle data with the functions that act on it. __init__ sets up each new instance, and self is how every method refers to the particular object it was called on.",
  s:[["class Dog:","Defines a new type."],
     ["    def __init__(self, name):","Runs when you create one."],
     ["        self.name = name","Stores data on the instance."],
     ["    def speak(self):","A method; self is the instance."],
     ["d = Dog(\"Rex\")","Creates an instance; __init__ runs."],
     ["d.name","Reads the stored attribute."],
     ["d.speak()","Calls the method on d."]],
  w:["Every method's first parameter is self. Forget it and calling gives a \"takes 0 positional arguments\" error.",
     "self.name (data on the object) is not the same as a plain variable name inside a method. Assign to self to make it stick.",
     "__init__ builds the object; it must return None, nothing else."]
 },
 "iterators & generators":{
  i:"An iterator produces values one at a time on demand. A generator is the easy way to write one: a function that yields values instead of returning once. It pauses at each yield and resumes where it left off, so it never holds the whole sequence at once.",
  s:[["def count(n):","A generator function."],
     ["    for i in range(n):","Loops inside it."],
     ["        yield i","Hands back one value, then pauses."],
     ["g = count(3)","Creates the generator; runs no body yet."],
     ["next(g)","Pulls the next value: 0."],
     ["for x in count(3):","Iterates until it is exhausted."],
     ["list(count(3))","Forces all values into a list."]],
  w:["A generator is single-use. Once exhausted, looping it again yields nothing — call the function again for a fresh one.",
     "yield makes the whole function a generator; calling it runs none of the body until you iterate.",
     "next() on an exhausted generator raises StopIteration. A for loop handles that for you."]
 }
},
javascript:{
 "let/const & types":{
  i:"Declare a variable with const when it never gets reassigned and let when it does. JavaScript has a small set of primitive types and coerces between them freely — convenient until it surprises you, so compare with === to keep types out of it.",
  s:[["const x = 5;","A binding you will not reassign."],
     ["let y = 1;","A binding you can reassign."],

     "== coerces types: \"\" == 0 and \"5\" == 5 are both true. Use === unless you have a reason.",
     "typeof null is \"object\" — a historical bug. Check x === null explicitly."]

 "template literals":{
  i:"A template literal is a string in backticks. Inside it, ${...} evaluates any expression and drops the result into the string, and the string can span several lines with no escapes. It replaces clumsy + concatenation.",

     "Everything between the backticks is kept verbatim, including indentation and line breaks.",
     "${} takes an expression, not a statement. You cannot put an if inside — use a ternary."]
 },
 "arrays":{
  i:"An array is an ordered, resizable list. It has methods for adding, removing, and copying, and some change the array in place while others return a new one — knowing which is which saves you from lost data.",

  w:["slice() copies; splice() changes the array in place. The names are easy to swap.",

 },
 "objects":{
  i:"An object maps string keys to values. You reach a value by key with dot or bracket notation. Objects model a thing with named fields, and they are passed around by reference, not copied.",
  s:[["const o = {name: \"Ada\", age: 36};","Two key/value pairs."],

     ["Object.entries(o)","An array of [key, value] pairs."],
     ["\"name\" in o","Tests for a key."]],

     "const o = other copies the reference; changing o.x changes other.x. Spread {...o} for a shallow copy.",
     "Reading a missing key gives undefined, not an error — a typo in a key name fails silently."]
 },
 "functions & arrow fns":{
  i:"A function takes arguments and returns a value. Arrow functions are a shorter syntax; a one-expression arrow returns that expression with no return keyword. Arrows also keep the surrounding this instead of getting their own.",
  s:[["function add(a, b) { return a + b; }","A named function."],
     ["const add = (a, b) => a + b;","The same thing as an arrow."],
     ["const sq = x => x * x;","One argument needs no parentheses."],
     ["const f = () => 42;","No arguments."],
     ["const g = x => ({v: x});","Wrap a returned object literal in parentheses."],
     ["function f(a = 1) {}","A default argument."]],
  w:["An arrow with braces needs an explicit return: x => { return x*2 }. Without braces it returns automatically.",
     "To return an object literal from an arrow, wrap it: x => ({a: x}). Bare braces read as a function body.",
     "Arrow functions have no own this — do not use them as object methods that rely on this."]
 },
 "map/filter/reduce":{
  i:"These three replace most loops over arrays. map transforms every element into a new array, filter keeps the elements that pass a test, and reduce boils the whole array down to a single value. None of them change the original.",
  s:[["nums.map(x => x * 2)","A new array, each element doubled."],
     ["nums.filter(x => x > 0)","Only the elements that pass the test."],
     ["nums.reduce((acc, x) => acc + x, 0)","Sums into acc, starting at 0."],
     ["nums.map((x, i) => i)","The callback also receives the index."],
     ["words.filter(Boolean)","Drops empty and falsy entries."],
     ["nums.reduce((a, b) => Math.max(a, b))","No seed: starts from the first element."]],
  w:["map always returns an array of the same length. To get fewer, that is filter.",
     "reduce needs a starting value as the second argument; leave it off on an empty array and it throws.",
     "These return new arrays. nums.map(...) on its own line does nothing unless you use the result."]
 },
 "destructuring":{
  i:"Destructuring unpacks values out of arrays and objects into variables in one statement. Array destructuring goes by position; object destructuring goes by key name.",
  s:[["const [a, b] = [1, 2];","a is 1, b is 2."],
     ["const [x, , z] = arr;","Skip the middle element."],
     ["const [head, ...rest] = arr;","rest is an array of the remainder."],
     ["const {name, age} = person;","Pull keys by name."],
     ["const {name: n} = person;","Rename to n."],
     ["const {city = \"NA\"} = person;","A default when the key is missing."],
     ["[a, b] = [b, a];","Swap without a temporary."]],
  w:["Object destructuring matches by key name, so order does not matter — but the names must match the keys exactly.",
     "Renaming is {key: newName}, which reads backwards the first few times.",
     "Destructuring null or undefined throws. Give a fallback: const {x} = obj || {}."]
 },
 "promises":{
  i:"A promise represents a value that is not ready yet — the result of something asynchronous. It settles once, either fulfilled with a value or rejected with an error, and you attach handlers with .then and .catch.",
  s:[["fetch(url)","Returns a promise, not the data."],
     ["p.then(v => ...)","Runs when it fulfills, with the value."],
     ["p.catch(e => ...)","Runs if it rejects."],
     ["p.finally(() => ...)","Runs either way."],
     ["Promise.resolve(5)","An already-fulfilled promise."],
     ["Promise.all([p1, p2])","Fulfills with both results, or rejects on the first failure."]],
  w:[".then gives you the value; the promise object itself is not the value. You cannot read it synchronously.",
     "An unhandled rejection is a silent bug. Always attach a .catch (or use try/catch with await).",
     "Promise.all rejects as soon as any one rejects. Use Promise.allSettled to get every result regardless."]
 },
 "async/await":{
  i:"async/await is syntax over promises that lets asynchronous code read top to bottom. await pauses inside an async function until a promise settles and gives you its value; errors surface as normal exceptions you catch with try/catch.",
  s:[["async function f() {}","Always returns a promise."],
     ["const v = await p;","Waits for p, then v is its value."],
     ["const data = await fetch(url);","Pauses until the fetch settles."],
     ["try { await p } catch (e) {}","Catches a rejection as an exception."],
     ["await Promise.all([a, b])","Wait for several at once."],
     ["const f = async () => { await g(); };","An async arrow function."]],
  w:["await only works inside an async function. At the top level of a normal script it is a syntax error.",
     "Awaiting inside a loop runs the calls one after another. To run them together, start them all, then await Promise.all.",
     "An async function returns a promise even when you return a plain value — the caller still awaits it."]
 },
 "closures":{
  i:"A closure is a function that remembers the variables from the scope where it was created, even after that scope has finished. It is what lets an inner function keep using an outer function's variables after the outer one returns.",
  s:[["function make(n) { return () => n; }","The returned function closes over n."],
     ["const get5 = make(5);","n is fixed at 5 for this one."],
     ["get5()","Returns 5, from the remembered n."],
     ["function counter() { let c = 0; return () => ++c; }","Keeps private state."],
     ["const next = counter();","One counter with its own c."],

  w:["Each call to the outer function makes a fresh closure with its own variables. Two counters do not share a count.",
     "A closure captures the variable, not a snapshot of its value. In a var loop, all closures see the final value — use let.",
     "Closures keep their captured variables alive in memory; holding many of them adds up."]
 }
},

/* ============ storage ============ */
const KEY="practicelog.offline.v1";
const blank={lang:"python",sessions:[],streak:{count:0,last:null},solid:{},shaky:{},queue:[]};
const clone=(o)=>JSON.parse(JSON.stringify(o));
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || clone(blank); }
catch(e){ S = clone(blank); }
if(!S || typeof S !== "object") S = clone(blank);
for(const k in blank) if(S[k]===undefined) S[k]=clone(blank[k]);
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ flash("Progress could not be saved — storage is full or blocked."); } }

/* ============ helpers ============ */
const $=(s)=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){ if(k==="class")n.className=v; else if(k.startsWith("on"))n.addEventListener(k.slice(2),v); else if(v!==null&&v!==undefined)n.setAttribute(k,v); }
  kids.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c))); return n;};
const today=()=>new Date().toISOString().slice(0,10);
const dayGap=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const norm=(s)=>String(s??"").replace(/\r/g,"").split("\n").map(l=>l.trimEnd()).join("\n").replace(/\s+/g," ").trim();
const online=()=>navigator.onLine;

/* ============ session state ============ */
let task=null, lesson=null, hintTier=0, secs=0, timer=null, running=false, exec=null, grade=null, banner=null, view="practice", busy=null;

function flash(msg){ banner=msg; render(); }
function startTimer(){ if(timer)clearInterval(timer); running=true; timer=setInterval(()=>{secs++; const c=$("#clock"),b=$("#bar"); if(c){c.textContent=fmtClock(); c.className="clock "+(secs>=900?"teal":"");} if(b){b.style.width=Math.min(100,secs/900*100)+"%"; b.style.background=secs>=900?"var(--teal)":"var(--gold)";}},1000); }
function stopTimer(){ running=false; if(timer)clearInterval(timer); }
const fmtClock=()=>String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");

/* ============ execution ============ */
let pyodide=null, pyTried=false;
const PY_CDNS=["https://cdn.jsdelivr.net/pyodide/v0.26.4/full/","https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.26.4/"];
function inject(base){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=base+"pyodide.js";s.onload=ok;s.onerror=()=>no(new Error("blocked"));document.head.appendChild(s);});}
async function bootPython(){
  if(pyodide) return pyodide;
  let last;
  for(const base of PY_CDNS){
    try{ if(!window.loadPyodide) await inject(base);
      pyodide = await window.loadPyodide({indexURL:base}); return pyodide; }
    catch(e){ last=e; }
  }
  pyTried=true;
  throw new Error(online()?"Python runtime unreachable":"no connection");
}
async function runPython(code){
  const py=await bootPython(); const out=[];
  py.setStdout({batched:s=>out.push(s)}); py.setStderr({batched:s=>out.push(s)});
  try{ await py.runPythonAsync(code); return {ok:true,output:out.join("\n")}; }
  catch(e){ return {ok:false,output:out.join("\n"),error:String(e.message||e).split("\n").filter(Boolean).slice(-3).join("\n")}; }
}
async function runJS(code){
  const out=[]; const fmt=v=>typeof v==="string"?v:(()=>{try{return JSON.stringify(v)}catch(e){return String(v)}})();
  const shim={log:(...a)=>out.push(a.map(fmt).join(" ")),error:(...a)=>out.push(a.map(fmt).join(" ")),warn:()=>{},info:(...a)=>out.push(a.map(fmt).join(" "))};
  try{
    const fn=new Function("console",`return (async()=>{\n${code}\n})()`);
    await fn(shim);
    await new Promise(r=>setTimeout(r,700));
    return {ok:true,output:out.join("\n")};
  }catch(e){ return {ok:false,output:out.join("\n"),error:String(e.message||e)}; }
}

/* ============ static checks ============ */
function lint(lang,code){
  const lines=code.split("\n"), f=[];
  const longest=Math.max(...lines.map(l=>l.length));
  if(longest>95) f.push({k:"readability",m:`A line runs ${longest} characters. Break it up.`});
  const names=[...code.matchAll(/\b([a-zA-Z_]\w*)\s*=[^=]/g)].map(m=>m[1]);
  const terse=names.filter(n=>n.length<=2&&!["i","j","k","n","x","y"].includes(n));
  if(terse.length) f.push({k:"readability",m:`Names like "${terse[0]}" say nothing. Spell them out.`});
  if(lang==="python"){
    if(/range\(\s*len\(/.test(code)) f.push({k:"idiomatic",m:"range(len(x)) is a C loop wearing Python. Iterate the items, or use enumerate()."});
    if(/==\s*(True|False)\b/.test(code)) f.push({k:"idiomatic",m:"Test truthiness directly — `if flag:` not `if flag == True:`."});
    if(/\+=\s*["']/.test(code)&&/\bfor\b/.test(code)) f.push({k:"efficiency",m:"Building a string with += in a loop reallocates every pass. Collect into a list, then .join()."});
    if(lines.length>15&&!/\bdef\b/.test(code)) f.push({k:"readability",m:"Fifteen-plus lines with no function. Give the logic a name."});
  }
  if(lang==="javascript"){
    if(/\bvar\b/.test(code)) f.push({k:"idiomatic",m:"`var` is legacy. Use const, or let when you genuinely reassign."});
    if(/[^=!<>]==[^=]/.test(code)) f.push({k:"idiomatic",m:"Use === . Loose equality coerces types and will bite you."});
    if(/for\s*\(\s*(let|var)\s+\w+\s*=\s*0/.test(code)&&/\.push\(/.test(code)) f.push({k:"idiomatic",m:"An index loop that pushes into an array is usually .map() or .filter()."});
  }
  if(lang==="mermaid"){
    if(!/^\s*(flowchart|graph|sequenceDiagram|classDiagram|stateDiagram|gantt|erDiagram)/m.test(code)) f.push({k:"correctness",m:"No diagram type declared on the first line."});
    if(!/(-->|->>|---|-\.->|==>)/.test(code)) f.push({k:"correctness",m:"No edges found. A diagram with no connections is not a diagram."});
  }
  if(lang==="r"){
    if(/=\s*(?!=)/.test(code)&&!/<-/.test(code)) f.push({k:"idiomatic",m:"R convention is <- for assignment, not =."});
    if(/for\s*\(/.test(code)) f.push({k:"idiomatic",m:"Explicit for loops are rare in R. Reach for the apply family or a vectorised operation."});
  }
  return f;
}
function gradeIt(lang,code,ex,t){
  const f=lint(lang,code), pick=k=>{const hit=f.find(x=>x.k===k);return hit&&hit.m;};
  let correctness=3, note="Not auto-verifiable — check your output against Expected yourself.";
  if(ex){
    if(!ex.ok){ correctness=1; note="It crashed: "+ex.error; }
    else if(t.o!=null){
      const hit=norm(ex.output)===norm(t.o);
      correctness=hit?5:2;
      note=hit?"Output matches exactly.":`Ran clean, but printed "${(ex.output||"nothing").trim()}" instead of "${t.o}".`;
    } else { correctness=4; note="Ran cleanly. No exact-output check for this one."; }
  }
  const sub=(k,good)=>pick(k)?3:good;
  return {
    scores:{correctness,readability:sub("readability",4),idiomatic:sub("idiomatic",4),efficiency:sub("efficiency",5)},
    notes:{
      correctness:pick("correctness")||note,
      readability:pick("readability")||"Nothing structural to flag.",
      idiomatic:pick("idiomatic")||"Reads like the language.",
      efficiency:pick("efficiency")||"Not relevant at this size.",
    },
    verdict: correctness===5?"Correct output, verified by running it."
      : correctness===1?"It does not run. Fix the error before worrying about style."
      : correctness===2?"Output did not match. Read the diff line by line."
      : "Graded on static checks only — no runtime available for this language.",
    mastered: correctness>=4,
  };
}

/* ============ actions ============ */
function nextConcept(){ const solid=S.solid[S.lang]||[]; return LADDER[S.lang].find(c=>!solid.includes(c))||"review"; }
function pickTask(){
  const solid=S.solid[S.lang]||[], target=nextConcept(), pool=BANK[S.lang]||[];
  const matches=pool.filter(x=>x.c===target);
  const unseen=pool.filter(x=>!solid.includes(x.c));
  const set = matches.length?matches : (unseen.length?unseen:pool);
  return set[Math.floor(Math.random()*set.length)]||null;
}
function teach(){
  lesson=nextConcept(); task=null; exec=null; grade=null; banner=null;
  render();
  setTimeout(()=>{const n=$("#lessoncard"); if(n&&n.scrollIntoView)n.scrollIntoView({behavior:"smooth",block:"start"});},60);
}
function newTask(){
  task=pickTask(); lesson=null; hintTier=0; exec=null; grade=null; banner=null; secs=0;
  if(!task){ flash("No exercises left in this language. Add more to BANK."); return; }
  startTimer(); render();
  setTimeout(()=>{const n=$("#taskcard"); if(n&&n.scrollIntoView)n.scrollIntoView({behavior:"smooth",block:"start"});},60);
}
async function submit(){
  const code=$("#code").value;
  if(!code.trim()||!task) return;
  stopTimer(); busy="Running your code…"; banner=null; render();
  const kind=LANGS[S.lang].runs;
  exec=null;
  if(kind==="native"){ exec=await runJS(code); }
  else if(kind==="pyodide"){
    busy = pyodide?"Running your code…":(online()?"Booting Python — one-time ~20s download":"Checking for the Python runtime…"); render();
    try{ exec=await runPython(code); }
    catch(e){
      S.queue.push({date:today(),lang:S.lang,concept:task.c,title:task.t,code,expected:task.o,secs}); persist();
      banner=`Python could not run (${e.message}). Your submission is queued — reconnect and tap "Grade queued" to run it for real. Static checks below still apply.`;
    }
  }
  grade=gradeIt(S.lang,code,exec,task);
  logSession(grade);
  busy=null; render();
  setTimeout(()=>{const n=$("#gradecard"); if(n&&n.scrollIntoView)n.scrollIntoView({behavior:"smooth",block:"start"});},60);
}
function logSession(g){
  const mins=Math.max(1,Math.round(secs/60)), d=today();
  const gap=S.streak.last?dayGap(S.streak.last,d):null;
  S.streak={count:gap===0?S.streak.count:gap===1?S.streak.count+1:1,last:d};
  S.sessions.unshift({date:d,lang:S.lang,mins,topic:task.c,score:g.scores.correctness,verdict:g.verdict});
  const solid=S.solid[S.lang]||[], shaky=S.shaky[S.lang]||[];
  const pass=g.mastered&&g.scores.correctness>=4;
  S.solid[S.lang]=pass?[...new Set([...solid,task.c])]:solid;
  S.shaky[S.lang]=pass?shaky.filter(c=>c!==task.c):[...new Set([...shaky,task.c])];
  persist();
}
async function drainQueue(){
  if(!S.queue.length) return;
  busy="Grading queued submissions…"; render();
  const still=[];
  for(const q of S.queue){
    if(q.lang!=="python"){ still.push(q); continue; }
    try{
      const ex=await runPython(q.code);
      const g=gradeIt("python",q.code,ex,{o:q.expected});
      const solid=S.solid.python||[], shaky=S.shaky.python||[];
      const pass=g.mastered;
      S.sessions.unshift({date:q.date,lang:"python",mins:Math.max(1,Math.round(q.secs/60)),topic:q.concept,score:g.scores.correctness,verdict:"(queued) "+g.verdict});
      S.solid.python=pass?[...new Set([...solid,q.concept])]:solid;
      S.shaky.python=pass?shaky.filter(c=>c!==q.concept):[...new Set([...shaky,q.concept])];
    }catch(e){ still.push(q); }
  }
  S.queue=still; persist();
  busy=null; banner=still.length?`${still.length} still pending — Python runtime is still unreachable.`:"Queue cleared. Results are in the ledger.";
  render();
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=el("a",{href:URL.createObjectURL(blob),download:"practice-log.json"});
  document.body.append(a); a.click(); a.remove();
}


/* ============ PWA: install + offline runtime ============ */
let swReg=null, cachedFiles=0;
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(r=>{swReg=r; askRuntime();}).catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{
    if(e.data&&e.data.type==="runtime-status"){ cachedFiles=e.data.files; render(); }
  });
}
function askRuntime(){ if(navigator.serviceWorker&&navigator.serviceWorker.controller)
  navigator.serviceWorker.controller.postMessage("runtime-status"); }
function standalone(){
  try{
    if(window.navigator&&window.navigator.standalone===true) return true;
    if(typeof window.matchMedia==="function") return window.matchMedia("(display-mode: standalone)").matches;
  }catch(e){}
  return false;
}

async function cacheRuntime(){
  if(!online()){ banner="Connect to wifi first — this downloads about 12 MB."; render(); return; }
  busy="Downloading Python runtime…"; banner=null; render();
  try{
    await bootPython();
    await runPython("print('ready')");
    banner="Python runtime cached. It will now work with no signal.";
  }catch(e){ banner="Could not cache the runtime: "+e.message; }
  busy=null; askRuntime(); render();
}

/* ============ render ============ */
function render(){
  const app=$("#app"); app.innerHTML="";
  const solid=S.solid[S.lang]||[], shaky=S.shaky[S.lang]||[];
  const totalMins=S.sessions.reduce((a,s)=>a+s.mins,0);

  app.append(el("header",{},
    el("h1",{},"Practice Log"),
    el("div",{class:"meta"},`${S.streak.count} DAY STREAK · ${totalMins} MIN · ${online()?"ONLINE":"OFFLINE"}`)
  ));

  const nav=el("nav",{});
  for(const[k,v]of Object.entries(LANGS))
    nav.append(el("button",{class:"tab"+(S.lang===k?" on":""),onclick:()=>{S.lang=k;persist();task=null;lesson=null;exec=null;grade=null;stopTimer();render();}},v.tag+(v.star?" ★":"")));
  nav.append(el("span",{style:"flex:1"}));
  nav.append(el("button",{class:"tab",onclick:()=>{view=view==="practice"?"ledger":"practice";render();}},view==="practice"?"LEDGER":"PRACTICE"));
  app.append(nav);

  if(banner) app.append(el("div",{class:"card banner"},banner));
  if(S.queue.length) app.append(el("div",{class:"card"},
    el("span",{class:"lab"},`${S.queue.length} submission${S.queue.length>1?"s":""} awaiting real execution`),
    el("button",{class:"ghost",style:"margin-top:10px",onclick:drainQueue},"Grade queued")));

  if(view==="ledger"){ renderLedger(app,solid,shaky); }
  else{
    // timer
    const bar=el("i",{id:"bar",style:`width:${Math.min(100,secs/900*100)}%`});
    const tcard=el("div",{class:"card"},
      el("div",{class:"row",style:"margin-bottom:8px"},
        el("span",{class:"lab"},"Today's 15 minutes"),
        el("span",{id:"clock",class:"clock"+(secs>=900?" teal":"")},fmtClock())),
      el("div",{class:"bar"},bar));
    if(task) tcard.append(el("button",{class:"ghost",style:"margin-top:10px",onclick:()=>{running?stopTimer():startTimer();render();}},running?"Pause":"Resume"));
    app.append(tcard);

    // milestone
    const runs=LANGS[S.lang].runs;
    const nc=nextConcept();
    const mile=el("div",{class:"card"},
      el("span",{class:"lab"},"Next milestone"),
      el("div",{style:"font-size:18px;font-weight:400;margin-top:6px"},nc),
      el("div",{class:"meta",style:"margin-top:4px"},
        `${solid.length} / ${LADDER[S.lang].length} cleared · ${runs==="native"?"graded by running your code":runs==="pyodide"?"graded by running your code (needs runtime)":"static checks only"}`));
    if(LESSONS[S.lang]&&LESSONS[S.lang][nc])
      mile.append(el("button",{class:"ghost",style:"margin-top:14px",onclick:teach},"Teach me this"));
    mile.append(el("button",{class:"primary",onclick:newTask},task?"Next exercise":"Give me an exercise"));
    app.append(mile);

    if(lesson) renderLesson(app);
    if(task) renderTask(app);
    if(exec) renderRun(app);
    if(grade) renderGrade(app);
  }

  const foot=el("footer",{});
  const ready = cachedFiles>0 || !!pyodide;
  foot.append(el("div",{},
    ready ? "Python runtime is cached — it runs with no signal. JavaScript always has."
          : "JavaScript runs fully offline. Python needs its runtime cached once while connected."));
  const acts=el("div",{style:"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"});
  if(!ready) acts.append(el("button",{class:"ghost",onclick:cacheRuntime},"Cache Python for offline (~12 MB)"));
  acts.append(el("button",{class:"ghost",onclick:exportData},"Export progress"));
  foot.append(acts);
  if(!standalone()) foot.append(el("div",{style:"margin-top:14px"},
    "Not installed yet. iOS: Share \u2192 Add to Home Screen. Android: menu \u2192 Install app."));
  app.append(foot);
}

function renderLesson(app){
  const data=(LESSONS[S.lang]||{})[lesson];
  const c=el("div",{class:"card",id:"lessoncard"});
  c.append(el("span",{class:"lab"},"Lesson · "+LANGS[S.lang].label),el("h2",{},lesson));
  if(!data){ c.append(el("p",{class:"brief"},"No lesson written for this concept yet.")); app.append(c); return; }
  c.append(el("p",{class:"brief"},data.i));
  const syn=el("div",{style:"margin-top:16px"});
  syn.append(el("span",{class:"lab"},"Syntax"));
  data.s.forEach(([code,desc])=>{
    syn.append(el("pre",{style:"margin-top:12px"},code));
    syn.append(el("p",{class:"note",style:"margin-top:4px"},desc));
  });
  c.append(syn);
  const warn=el("div",{style:"margin-top:16px"});
  warn.append(el("span",{class:"lab"},"Common mistakes"));
  data.w.forEach(g=>warn.append(el("div",{class:"hint",style:"margin-top:10px"},g)));
  c.append(warn);
  c.append(el("button",{class:"primary",onclick:newTask},"Give me an exercise on this"));
  app.append(c);
}
function renderTask(app){
  const c=el("div",{class:"card",id:"taskcard"});
  c.append(el("span",{class:"lab"},task.c),el("h2",{},task.t),el("p",{class:"brief"},task.b));
  c.append(el("div",{style:"margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)"},
    el("span",{class:"lab"},task.o!=null?"Expected output · checked automatically":"Expected result · not auto-checkable"),
    el("pre",{},task.o??"—")));
  const hints=el("div",{style:"margin-top:14px"});
  task.h.slice(0,hintTier).forEach((h,i)=>hints.append(el("div",{class:"hint"},el("b",{},"TIER "+(i+1)),el("br"),h)));
  if(hintTier<task.h.length) hints.append(el("button",{class:"ghost",onclick:()=>{hintTier++;render();}},hintTier===0?"I'm stuck — nudge me":"Next hint"));
  c.append(hints);
  const ta=el("textarea",{id:"code",spellcheck:"false",autocapitalize:"off",autocorrect:"off",placeholder:`Write your ${LANGS[S.lang].label} here…`});
  ta.value = window._draft || "";
  ta.addEventListener("input",e=>{window._draft=e.target.value;});
  ta.addEventListener("focus",()=>{if(!running&&!grade)startTimer();});
  c.append(ta);
  c.append(el("button",{class:"primary",disabled:busy?"":null,onclick:submit},busy||(LANGS[S.lang].runs?"Run and grade":"Check and grade")));
  app.append(c);
}

function renderRun(app){
  const pass=exec.ok&&task.o!=null&&norm(exec.output)===norm(task.o);
  const cls=pass?"teal":"sig";
  const c=el("div",{class:"card thick",style:`border-color:var(--${pass?"teal":"sig"})`});
  c.append(el("div",{class:"row"},el("span",{class:"lab"},"Execution"),
    el("span",{class:cls,style:"font-size:13px;font-weight:500;letter-spacing:.06em"},
      !exec.ok?"ERROR":task.o==null?"RAN":pass?"PASS":"MISMATCH")));
  if(!exec.ok){ c.append(el("span",{class:"lab",style:"margin-top:10px"},"Traceback"),el("pre",{class:"sig"},exec.error)); }
  c.append(el("span",{class:"lab",style:"margin-top:10px"},"Your output"),el("pre",{},exec.output||"(nothing printed)"));
  if(task.o!=null&&!pass) c.append(el("span",{class:"lab",style:"margin-top:10px"},"Expected"),el("pre",{class:"teal"},task.o));
  app.append(c);
}

function renderGrade(app){
  const c=el("div",{class:"card thick",id:"gradecard"});
  c.append(el("div",{class:"row"},el("span",{class:"lab"},"Graded"),
    el("span",{class:"meta"},exec?"BY EXECUTION":"STATIC ONLY")));
  ["correctness","readability","idiomatic","efficiency"].forEach(k=>{
    const v=grade.scores[k], cls=v>=4?"teal":v>=3?"gold":"sig";
    const pips=el("div",{class:"pips"});
    for(let n=1;n<=5;n++){const i=el("i");if(n<=v)i.style.background=`var(--${v>=4?"teal":v>=3?"gold":"sig"})`;pips.append(i);}
    c.append(el("div",{style:"margin-top:12px"},
      el("div",{class:"row",style:"font-size:12px;font-weight:400;letter-spacing:.06em;text-transform:uppercase"},
        el("span",{},k+(k==="correctness"&&exec?" · by execution":"")),
        el("span",{class:cls,style:"font-weight:500"},v+"/5")),
      pips, el("p",{class:"note"},grade.notes[k])));
  });
  c.append(el("p",{class:"verdict"},grade.verdict));
  app.append(c);
}

function renderLedger(app,solid,shaky){
  const lad=el("div",{class:"card"},el("span",{class:"lab"},LANGS[S.lang].label+" ladder"));
  LADDER[S.lang].forEach(c=>{
    const done=solid.includes(c),weak=shaky.includes(c);
    lad.append(el("div",{class:"lad"},
      el("span",{class:done?"teal":weak?"sig":"",style:"width:16px"},done?"✓":weak?"!":"·"),
      el("span",{style:done?"":"color:var(--soft)"},c)));
  });
  app.append(lad);
  const ses=el("div",{class:"card"},el("span",{class:"lab"},"Sessions"));
  const mine=S.sessions.filter(s=>s.lang===S.lang);
  if(!mine.length) ses.append(el("p",{class:"note"},"Nothing logged in "+LANGS[S.lang].label+" yet."));
  mine.slice(0,40).forEach(s=>ses.append(el("div",{style:"padding:8px 0;border-bottom:1px solid var(--rule)"},
    el("div",{class:"row",style:"font-size:13px"},
      el("span",{},`${s.date} · ${s.topic}`),
      el("span",{class:s.score>=4?"teal":"sig"},`${s.score}/5 · ${s.mins}m`)),
    el("p",{class:"note",style:"margin-top:4px"},s.verdict))));
  app.append(ses);
}

window.addEventListener("online",render);
window.addEventListener("offline",render);
window.addEventListener("error",function(e){
  const a=document.getElementById("app");
  if(a && !a.children.length){
    a.innerHTML='<div class="card banner"><b>Something broke on load.</b><br>'+
      String(e.message||e)+'</div>';
  }
});
try{ render(); }
catch(e){
  document.getElementById("app").innerHTML=
    '<div class="card banner"><b>Render failed.</b><br>'+String(e.message||e)+'</div>';
}
</script>
</body>
</html>
